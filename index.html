<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Broadcast Pro - 校内Meet放送 ディレクター</title>
  <style>
    :root {
      --bg-dark: #0b1120;
      --panel-bg: #172338;
      --panel-border: #33445f;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --danger-color: #ef4444;
      --success-color: #10b981;
      --warning-color: #f59e0b;
      --text-main: #f8fafc;
      --text-sub: #a9b8cc;
      --touch-target: 58px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    button, select, input, label {
      touch-action: manipulation;
    }

    button {
      font: inherit;
    }

    header {
      min-height: 64px;
      background: #080e1b;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 20px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand h1 {
      font-size: clamp(1rem, 1.8vw, 1.45rem);
      font-weight: 800;
      letter-spacing: .2px;
      color: #60a5fa;
    }

    .brand .subtitle {
      font-size: .85rem;
      color: var(--text-sub);
      background: #172338;
      padding: 5px 9px;
      border-radius: 6px;
      border: 1px solid var(--panel-border);
      white-space: nowrap;
    }

    .header-center { display: none; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-pgm-window {
      min-height: 48px;
      background: #7c3aed;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 9px;
      font-size: .95rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .2s, transform .1s;
    }

    .btn-pgm-window:hover { background: #6d28d9; }
    button:active { transform: scale(.98); }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px;
      padding: 14px;
      min-height: 0;
      overflow: hidden;
    }

    .program-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
      min-height: 0;
    }

    .monitor-box {
      flex: 1;
      min-height: 0;
      background: #000;
      border-radius: 12px;
      border: 2px solid var(--danger-color);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .monitor-header {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .monitor-tag {
      font-size: .8rem;
      font-weight: 900;
      padding: 7px 10px;
      border-radius: 5px;
      color: white;
      letter-spacing: .4px;
      background: #dc2626;
    }

    .canvas-container {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .clock-panel {
      flex-shrink: 0;
      min-height: 112px;
      background: #080e1b;
      border: 1px solid #263750;
      border-radius: 12px;
      padding: 10px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .clock-label {
      font-size: .85rem;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: .12em;
    }

    .clock-display {
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(2.5rem, 5vw, 4.8rem);
      line-height: 1.05;
      font-weight: 900;
      color: #38bdf8;
      letter-spacing: .04em;
      font-variant-numeric: tabular-nums;
    }

    .status-badge {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(239, 68, 68, .18);
      border: 1px solid var(--danger-color);
      color: #fca5a5;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: .85rem;
      font-weight: 800;
    }

    .status-badge.active { display: flex; }

    .status-dot {
      width: 9px;
      height: 9px;
      background-color: var(--danger-color);
      border-radius: 50%;
      animation: blink 1s infinite alternate;
    }

    @keyframes blink {
      0% { opacity: .3; }
      100% { opacity: 1; }
    }

    .control-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      overscroll-behavior: contain;
      min-width: 0;
      min-height: 0;
      padding-right: 3px;
      scrollbar-width: thin;
      scrollbar-color: #475569 transparent;
    }

    .panel-block {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-title {
      font-size: .9rem;
      font-weight: 800;
      color: #c2d0e2;
      letter-spacing: .02em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .main-screen-actions,
    .device-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-screen-switch {
      min-height: 66px;
      border: 1px solid #52647e;
      border-radius: 9px;
      font-weight: 800;
      font-size: clamp(.95rem, 1.25vw, 1.15rem);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      background: #334155;
      color: white;
      transition: background .2s, box-shadow .2s;
    }

    .btn-screen-switch.active {
      background: #2563eb;
      border-color: #60a5fa;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, .35);
    }

    .btn-toggle-large {
      min-height: var(--touch-target);
      border: 1px solid transparent;
      border-radius: 9px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 9px;
      transition: background .2s;
    }

    .btn-mic-on {
      background: #065f46;
      color: #a7f3d0;
      border-color: #059669;
    }

    .btn-mic-off {
      background: #7f1d1d;
      color: #fecaca;
      border-color: #dc2626;
    }

    .btn-flip {
      background: #334155;
      color: white;
      border-color: #52647e;
    }

    .btn-flip.active {
      background: #1d4ed8;
      border-color: #60a5fa;
    }

    .audio-meter-container {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0b1424;
      padding: 10px;
      border-radius: 7px;
      border: 1px solid #334155;
      min-height: 40px;
    }

    .audio-meter-label {
      font-size: .75rem;
      font-weight: 800;
      color: var(--text-sub);
      width: 84px;
      flex-shrink: 0;
    }

    .meter-bar-outer {
      flex: 1;
      height: 12px;
      background: #1e293b;
      border-radius: 6px;
      overflow: hidden;
    }

    .meter-bar-inner {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981 0%, #f59e0b 70%, #ef4444 100%);
      transition: width .05s ease-out;
    }

    .select-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .select-group label {
      font-size: .85rem;
      font-weight: 700;
      color: var(--text-sub);
    }

    select, input[type="text"] {
      background: #0b1424;
      color: white;
      border: 1px solid #455873;
      padding: 11px 12px;
      border-radius: 7px;
      font-size: 1rem;
      outline: none;
      width: 100%;
      min-height: 46px;
      user-select: text;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, .2);
    }

    .preset-grid {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .preset-item {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 9px;
      align-items: center;
    }

    .preset-btn {
      min-height: 48px;
      background: #334155;
      color: white;
      border: 1px solid #52647e;
      padding: 8px 12px;
      border-radius: 7px;
      font-size: .95rem;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
    }

    .preset-btn:hover { background: #475569; }

    .preset-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
    }

    .preset-input { min-width: 0; }

    .btn-school-song {
      min-height: 58px;
      background: #b96505;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 9px;
      font-weight: 900;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
    }

    .btn-school-song:hover { background: #a65305; }

    .btn-school-song.active {
      background: #dc2626;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, .6); }
      70% { box-shadow: 0 0 0 8px rgba(220, 38, 38, 0); }
      100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
    }

    .telop-control-group {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .telop-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .telop-row input { min-width: 0; }

    .btn-telop-toggle {
      min-width: 86px;
      min-height: 46px;
      background: #334155;
      color: white;
      border: 1px solid #52647e;
      padding: 8px 12px;
      border-radius: 7px;
      font-size: .9rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-telop-toggle.active {
      background: var(--success-color);
      border-color: #34d399;
      color: #052e24;
    }

    footer {
      min-height: 26px;
      background: #080e1b;
      border-top: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 10px;
      font-size: .7rem;
      color: #64748b;
      flex-shrink: 0;
    }

    .file-input-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
    }

    .file-input-wrapper label {
      font-size: .8rem;
      font-weight: 700;
      background: #334155;
      padding: 9px 10px;
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .file-input-wrapper input[type="file"] { display: none; }

    .file-name {
      font-size: .8rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    @media (max-width: 900px) {
      body { overflow: auto; }
      main {
        grid-template-columns: 1fr;
        overflow: visible;
      }
      .program-panel { min-height: 55vh; }
      .monitor-box { min-height: 300px; }
      .clock-panel { min-height: 100px; }
      .clock-display { font-size: clamp(2.8rem, 9vw, 4.5rem); }
      .control-panel { overflow: visible; }
      .brand .subtitle { display: none; }
    }

    @media (max-width: 520px) {
      header { padding: 10px 12px; gap: 8px; }
      .brand h1 { font-size: .95rem; }
      .btn-pgm-window { min-height: 46px; padding: 8px 10px; font-size: .8rem; }
      main { padding: 9px; gap: 10px; }
      .panel-block { padding: 11px; }
      .btn-screen-switch { min-height: 60px; font-size: .9rem; }
      .preset-item { grid-template-columns: 60px minmax(0, 1fr); }
      .file-input-wrapper { align-items: flex-start; flex-direction: column; gap: 4px; padding: 4px 0; }
    }
    /* Compact broadcast-console layout: keep the whole app inside the viewport */
    :root { --touch-target: 44px; }

    html, body { height: 100%; }
    body { height: 100dvh; min-height: 0; overflow: hidden; }

    header {
      min-height: 48px;
      height: 48px;
      padding: 5px 14px;
      gap: 10px;
    }
    .brand { gap: 8px; }
    .brand h1 { font-size: 1.05rem; white-space: nowrap; }
    .brand .subtitle { font-size: .72rem; padding: 3px 7px; }
    .btn-pgm-window {
      min-height: 36px;
      padding: 6px 12px;
      font-size: .82rem;
      border-radius: 7px;
      white-space: nowrap;
    }

    main {
      height: calc(100dvh - 68px);
      min-height: 0;
      grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
      gap: 10px;
      padding: 10px;
      overflow: hidden;
    }
    .program-panel { gap: 8px; min-height: 0; }
    .monitor-box { flex: 1 1 auto; min-height: 0; border-width: 1px; border-radius: 9px; }
    .monitor-header { top: 8px; left: 8px; }
    .monitor-tag { font-size: .68rem; padding: 5px 7px; }
    .clock-panel {
      min-height: 76px;
      padding: 6px 10px;
      gap: 0;
      border-radius: 9px;
    }
    .clock-label { font-size: .68rem; }
    .clock-display { font-size: clamp(2rem, 4vw, 3.3rem); line-height: 1.05; }
    .clock-panel .status-badge { padding: 3px 8px; font-size: .7rem; }
    .status-dot { width: 7px; height: 7px; }

    .control-panel {
      min-height: 0;
      overflow-y: auto;
      gap: 8px;
      padding: 0 3px 2px 0;
    }
    .panel-block {
      padding: 10px;
      gap: 8px;
      border-radius: 8px;
    }
    .panel-title { font-size: .78rem; }
    .main-screen-actions,
    .device-actions {
      grid-template-columns: repeat(2, minmax(0, 180px));
      justify-content: center;
      gap: 8px;
    }
    .btn-screen-switch {
      min-height: 48px;
      padding: 7px 8px;
      font-size: .88rem;
      border-radius: 8px;
    }
    .btn-toggle-large {
      min-height: 42px;
      padding: 7px 8px;
      font-size: .84rem;
      border-radius: 8px;
    }
    .audio-meter-container { min-height: 32px; padding: 6px 8px; gap: 8px; }
    .audio-meter-label { width: 72px; font-size: .68rem; }
    .meter-bar-outer { height: 9px; }
    .select-group { gap: 4px; }
    .select-group label { font-size: .74rem; }
    select, input[type="text"] {
      min-height: 36px;
      padding: 7px 9px;
      font-size: .86rem;
      border-radius: 6px;
    }
    .preset-grid { gap: 5px; }
    .preset-item { grid-template-columns: 48px minmax(0, 1fr); gap: 7px; }
    .preset-btn { min-height: 36px; padding: 5px 7px; font-size: .8rem; }
    .telop-control-group { gap: 6px; }
    .telop-row { grid-template-columns: minmax(0, 1fr) 70px; gap: 6px; }
    .btn-telop-toggle { min-width: 0; min-height: 36px; padding: 5px 7px; font-size: .8rem; }
    .btn-school-song {
      min-height: 42px;
      max-width: 250px;
      width: 100%;
      align-self: center;
      padding: 7px 10px;
      font-size: .86rem;
      border-radius: 8px;
    }
    .file-input-wrapper { min-height: 30px; gap: 7px; }
    .file-input-wrapper label { padding: 6px 8px; font-size: .72rem; }
    .file-name { font-size: .72rem; }
    footer { min-height: 20px; height: 20px; padding: 2px 8px; font-size: .64rem; }

    /* On smaller windows, allow the document to scroll naturally instead of clipping controls. */
    @media (max-width: 900px) {
      body { height: auto; min-height: 100%; overflow: auto; }
      header { height: auto; min-height: 48px; }
      main { height: auto; grid-template-columns: 1fr; overflow: visible; }
      .program-panel { min-height: 0; }
      .monitor-box { min-height: 42vw; aspect-ratio: 16 / 9; }
      .clock-panel { min-height: 76px; }
      .clock-display { font-size: clamp(2.2rem, 8vw, 3.3rem); }
      .control-panel { overflow: visible; }
      .brand .subtitle { display: none; }
    }
    @media (max-width: 520px) {
      header { padding: 7px 9px; }
      .brand h1 { font-size: .85rem; }
      .btn-pgm-window { min-height: 34px; padding: 5px 7px; font-size: .7rem; }
      main { padding: 8px; gap: 8px; }
      .panel-block { padding: 9px; }
      .main-screen-actions, .device-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .btn-screen-switch { min-height: 44px; font-size: .82rem; }
      .preset-item { grid-template-columns: 42px minmax(0, 1fr); }
      .file-input-wrapper { align-items: center; flex-direction: row; gap: 6px; }
      .file-input-wrapper label { max-width: 42%; }
    }
    @media (max-height: 700px) and (min-width: 901px) {
      header { height: 42px; min-height: 42px; }
      main { height: calc(100dvh - 62px); padding: 7px; gap: 8px; }
      .clock-panel { min-height: 64px; }
      .clock-display { font-size: clamp(1.8rem, 3.5vw, 2.7rem); }
      .panel-block { padding: 8px; gap: 6px; }
      .control-panel { gap: 6px; }
      footer { height: 20px; min-height: 20px; }
    }

    /* Requested control layout refinements */
    .operations-block { gap: 10px; }
    .operation-section { display: flex; flex-direction: column; gap: 7px; }
    .subsection-title { color: var(--text-sub); font-size: .74rem; font-weight: 800; }
    .main-screen-actions, .device-actions {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      justify-content: stretch;
      gap: 8px;
    }
    .btn-screen-switch, .btn-toggle-large { width: 100%; min-width: 0; }
    .btn-screen-switch { min-height: 52px; }
    .btn-toggle-large { min-height: 46px; }
    .device-selects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: start; }
    .mic-select-group { min-width: 0; }
    .mic-select-group .audio-meter-container { margin-top: 2px; min-height: 30px; padding: 5px 7px; gap: 6px; }
    .mic-select-group .audio-meter-label { width: auto; font-size: .62rem; }
    .mic-select-group .meter-bar-outer { min-width: 20px; height: 9px; }
    .song-operation .btn-school-song { width: 100%; max-width: none; min-height: 48px; }
    .preset-panel-title { gap: 8px; flex-wrap: wrap; }
    .upload-compact-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 32px; padding: 5px 10px; background: #334155; border: 1px solid #52647e; border-radius: 6px; color: #fff; font-size: .72rem; font-weight: 800; cursor: pointer; white-space: nowrap; }
    .upload-compact-btn:hover { background: #475569; }
    .hidden-file-input { display: none; }
    .preset-image-name { font-size: .68rem; }
    .telop-control-group { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .telop-row { grid-template-columns: minmax(0, 1fr) 58px; gap: 5px; }
    .btn-telop-toggle { min-width: 0; padding: 5px; }
    @media (min-width: 901px) {
      .control-panel { gap: 8px; }
      .panel-block { padding: 9px; gap: 7px; }
      .operations-block { gap: 8px; }
    }
    @media (max-width: 520px) {
      .device-selects { grid-template-columns: 1fr 1fr; gap: 7px; }
      .telop-control-group { grid-template-columns: 1fr; }
      .preset-panel-title { align-items: flex-start; }
      .upload-compact-btn { min-height: 30px; }
    }

  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand">
      <h1>School Broadcast Pro</h1>
      <span class="subtitle">校内Meet放送 ディレクター</span>
    </div>

    <div class="header-center">
      <div id="statusBadge" class="status-badge">
        <div class="status-dot"></div>
        <span>校歌演奏中</span>
      </div>
    </div>

    <div class="header-actions">
      <button id="openPgmBtn" class="btn-pgm-window">
         Meet共有用画面を開く (PGM)
      </button>
    </div>
  </header>

  <!-- MAIN WRAPPER (Left: Monitor, Right: Controls) -->
  <main>
    <!-- LEFT: PROGRAM MONITOR -->
    <div class="program-panel">
      <div class="monitor-box">
        <div class="monitor-header">
          <span class="monitor-tag">PROGRAM (放送中の画面)</span>
        </div>
        <div class="canvas-container">
          <canvas id="pgmCanvas" width="1280" height="720"></canvas>
        </div>
      </div>
      <div class="clock-panel">
        <div class="clock-label">現在時刻</div>
        <div id="clock" class="clock-display">00:00:00</div>
        <div id="programStatus" class="status-badge">
          <div class="status-dot"></div>
          <span>校歌演奏中</span>
        </div>
      </div>
    </div>

    <!-- RIGHT: CONTROL PANEL -->
    <div class="control-panel">

      <!-- BROADCAST OPERATIONS: screen, device, and school song in one column -->
      <div class="panel-block operations-block">
        <div class="panel-title">放送操作</div>
        <div class="operation-section">
          <div class="subsection-title">画面切り替え（自動フェード）</div>
          <div class="main-screen-actions">
            <button id="btnSwitchCamera" class="btn-screen-switch active" onclick="switchToSource('camera')">カメラ画面</button>
            <button id="btnSwitchStandby" class="btn-screen-switch" onclick="switchToSource('standby')">待機画面</button>
          </div>
        </div>
        <div class="operation-section">
          <div class="subsection-title">デバイス設定</div>
          <div class="device-actions">
            <button id="cameraFlipBtn" class="btn-toggle-large btn-flip">カメラ反転: OFF</button>
            <button id="micToggleBtn" class="btn-toggle-large btn-mic-on">マイク: ON</button>
          </div>
          <div class="device-selects">
            <div class="select-group">
              <label for="cameraSelect">カメラ選択</label>
              <select id="cameraSelect"></select>
            </div>
            <div class="select-group mic-select-group">
              <label for="micSelect">マイク選択</label>
              <select id="micSelect"></select>
              <div class="audio-meter-container">
                <span class="audio-meter-label">MIC LEVEL</span>
                <div class="meter-bar-outer"><div id="micMeterBar" class="meter-bar-inner"></div></div>
              </div>
            </div>
          </div>
        </div>
        <div class="operation-section song-operation">
          <button id="schoolSongBtn" class="btn-school-song">校歌 再生 / 歌詞表示</button>
        </div>
      </div>

      <!-- PRESETS PANEL -->
      <div class="panel-block">
        <div class="panel-title preset-panel-title">
          <span>プリセット待機文字</span>
          <label class="upload-compact-btn" for="presetImageFile">画像をアップロード</label>
          <input type="file" id="presetImageFile" accept="image/*" class="hidden-file-input">
        </div>
        <div id="presetImageName" class="file-name preset-image-name">待機画像：未選択</div>
        <div class="preset-grid">
          <div class="preset-item">
            <button class="preset-btn" onclick="applyPreset(0)">P1</button>
            <input type="text" id="presetText0" class="preset-input" value="今日はテレビ放送があります" oninput="updatePresetTitle(0, this.value)">
          </div>
          <div class="preset-item">
            <button class="preset-btn" onclick="applyPreset(1)">P2</button>
            <input type="text" id="presetText1" class="preset-input" value="しばらくお待ちください" oninput="updatePresetTitle(1, this.value)">
          </div>
          <div class="preset-item">
            <button class="preset-btn" onclick="applyPreset(2)">P3</button>
            <input type="text" id="presetText2" class="preset-input" value="まもなくテレビ放送が始まります" oninput="updatePresetTitle(2, this.value)">
          </div>
          <div class="preset-item">
            <button class="preset-btn" onclick="applyPreset(3)">P4</button>
            <input type="text" id="presetText3" class="preset-input" value="マイクをオフにしてお待ちください" oninput="updatePresetTitle(3, this.value)">
          </div>
          <div class="preset-item">
            <button class="preset-btn" onclick="applyPreset(4)">P5</button>
            <input type="text" id="presetText4" class="preset-input" value="本日の放送は終了しました" oninput="updatePresetTitle(4, this.value)">
          </div>
        </div>
      </div>

      <!-- OVERLAY TELOPS -->
      <div class="panel-block">
        <div class="panel-title">オーバーレイテロップ</div>
        <div class="telop-control-group">
          <div class="telop-row">
            <input type="text" id="telopTopLeftInput" placeholder="左上テロップ（例: 児童会から）">
            <button id="telopTopLeftBtn" class="btn-telop-toggle" onclick="toggleTelop('topLeft')">表示</button>
          </div>
          <div class="telop-row">
            <input type="text" id="telopBottomInput" placeholder="下部テロップ（例: 5年1組 長谷川）">
            <button id="telopBottomBtn" class="btn-telop-toggle" onclick="toggleTelop('bottom')">表示</button>
          </div>
        </div>
      </div>

      <!-- SCHOOL SONG & MEDIA ASSETS -->
      <div class="panel-block">
        <div class="panel-title">校歌 &amp; メディア素材</div>

        <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 4px;">
          <div class="file-input-wrapper">
            <label for="songImageFile">校歌歌詞画像</label>
            <input type="file" id="songImageFile" accept="image/*">
            <span id="songImgName" class="file-name">未選択</span>
          </div>
          <div class="file-input-wrapper">
            <label for="songAudioFile">校歌音声 (MP3)</label>
            <input type="file" id="songAudioFile" accept="audio/*">
            <span id="songAudioName" class="file-name">未選択</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    &copy; 2026 Hasegawa Konosuke. All rights reserved.
  </footer>

  <script>
    // GLOBAL STATE & VARIABLES
    const STATE = {
      currentSource: 'camera', // 'camera', 'standby', 'school_song'
      targetSource: 'camera',
      cameraFlipped: false,
      micMuted: false,
      schoolSongActive: false,
      
      presets: [
        "今日はテレビ放送があります",
        "しばらくお待ちください",
        "まもなくテレビ放送が始まります",
        "マイクをオフにしてお待ちください",
        "本日の放送は終了しました"
      ],
      currentStandbyText: "しばらくお待ちください",

      telops: {
        topLeft: { text: "", active: false, opacity: 0 },
        bottom: { text: "", active: false, opacity: 0 }
      },

      // Fade Transition State
      transitioning: false,
      transitionProgress: 0
    };

    // DOM ELEMENTS
    const pgmCanvas = document.getElementById('pgmCanvas');
    const pgmCtx = pgmCanvas.getContext('2d');

    const clockEl = document.getElementById('clock');
    const statusBadge = document.getElementById('programStatus');
    const cameraSelect = document.getElementById('cameraSelect');
    const micSelect = document.getElementById('micSelect');
    const micToggleBtn = document.getElementById('micToggleBtn');
    const cameraFlipBtn = document.getElementById('cameraFlipBtn');
    const micMeterBar = document.getElementById('micMeterBar');
    const schoolSongBtn = document.getElementById('schoolSongBtn');
    const btnSwitchCamera = document.getElementById('btnSwitchCamera');
    const btnSwitchStandby = document.getElementById('btnSwitchStandby');

    // MEDIA ASSETS
    let cameraVideo = document.createElement('video');
    cameraVideo.autoplay = true;
    cameraVideo.playsInline = true;

    let bgImage = new Image();
    let songLyricsImage = new Image();
    let songAudio = new Audio();

    // WEB AUDIO API
    let audioCtx = null;
    let micStream = null;
    let micSourceNode = null;
    let analyserNode = null;
    let audioDestination = null;

    let pgmWindow = null;

    // INITIALIZATION
    window.addEventListener('DOMContentLoaded', () => {
      initClock();
      initDevices();
      initAudio();
      renderLoop();
    });

    // CLOCK
    function initClock() {
      setInterval(() => {
        const now = new Date();
        clockEl.textContent = now.toTimeString().split(' ')[0];
      }, 1000);
    }

    // DEVICE SETUP
    async function initDevices() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        cameraSelect.innerHTML = '';
        micSelect.innerHTML = '';

        devices.forEach(device => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          if (device.kind === 'videoinput') {
            option.text = device.label || `カメラ ${cameraSelect.length + 1}`;
            cameraSelect.appendChild(option);
          } else if (device.kind === 'audioinput') {
            option.text = device.label || `マイク ${micSelect.length + 1}`;
            micSelect.appendChild(option);
          }
        });

        if (cameraSelect.options.length > 0) startCamera(cameraSelect.value);
        if (micSelect.options.length > 0) startMic(micSelect.value);

      } catch (e) {
        console.error("Device Enumeration Error:", e);
      }
    }

    cameraSelect.addEventListener('change', () => startCamera(cameraSelect.value));
    micSelect.addEventListener('change', () => startMic(micSelect.value));

    async function startCamera(deviceId) {
      if (cameraVideo.srcObject) {
        cameraVideo.srcObject.getTracks().forEach(t => t.stop());
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { deviceId: { exact: deviceId }, width: 1280, height: 720, frameRate: 30 }
        });
        cameraVideo.srcObject = stream;
      } catch (e) {
        console.error("Camera Start Error:", e);
      }
    }

    // AUDIO SYSTEM
    async function initAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyserNode = audioCtx.createAnalyser();
      analyserNode.fftSize = 64;
      audioDestination = audioCtx.createMediaStreamDestination();

      updateAudioMeter();
    }

    async function startMic(deviceId) {
      if (!audioCtx) await initAudio();
      if (micStream) micStream.getTracks().forEach(t => t.stop());

      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { deviceId: { exact: deviceId }, echoCancellation: true, noiseSuppression: true }
        });
        micSourceNode = audioCtx.createMediaStreamSource(micStream);
        micSourceNode.connect(analyserNode);
        micSourceNode.connect(audioDestination);
      } catch (e) {
        console.error("Mic Start Error:", e);
      }
    }

    function updateAudioMeter() {
      requestAnimationFrame(updateAudioMeter);
      if (!analyserNode || STATE.micMuted) {
        micMeterBar.style.width = '0%';
        return;
      }

      const dataArray = new Uint8Array(analyserNode.frequencyBinCount);
      analyserNode.getByteFrequencyData(dataArray);
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
      let average = sum / dataArray.length;
      let val = Math.min(100, Math.round((average / 128) * 100));
      micMeterBar.style.width = val + '%';
    }

    // MIC MUTE & FLIP CONTROLS
    micToggleBtn.addEventListener('click', () => {
      STATE.micMuted = !STATE.micMuted;
      if (micStream) {
        micStream.getAudioTracks().forEach(t => t.enabled = !STATE.micMuted);
      }
      if (STATE.micMuted) {
        micToggleBtn.textContent = ' マイク: OFF';
        micToggleBtn.className = 'btn-toggle-large btn-mic-off';
      } else {
        micToggleBtn.textContent = ' マイク: ON';
        micToggleBtn.className = 'btn-toggle-large btn-mic-on';
      }
    });

    cameraFlipBtn.addEventListener('click', () => {
      STATE.cameraFlipped = !STATE.cameraFlipped;
      cameraFlipBtn.classList.toggle('active', STATE.cameraFlipped);
      cameraFlipBtn.textContent = STATE.cameraFlipped ? 'カメラ反転: ON' : 'カメラ反転: OFF';
    });

    // FILE UPLOAD HANDLERS
    document.getElementById('presetImageFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        bgImage.src = URL.createObjectURL(file);
        document.getElementById('presetImageName').textContent = `待機画像：${file.name}`;
      }
    });

    document.getElementById('songImageFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        songLyricsImage.src = URL.createObjectURL(file);
        document.getElementById('songImgName').textContent = file.name;
      }
    });

    document.getElementById('songAudioFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        songAudio.src = URL.createObjectURL(file);
        document.getElementById('songAudioName').textContent = file.name;
      }
    });

    // PRESET & SOURCE SWITCHING WITH AUTOMATIC CROSSFADE
    function updatePresetTitle(index, val) {
      STATE.presets[index] = val;
      const btns = document.querySelectorAll('.preset-btn');
      if (btns[index]) btns[index].textContent = `P${index + 1}`;
    }

    function applyPreset(index) {
      autoTurnOffTelops();
      STATE.currentStandbyText = STATE.presets[index];

      // Highlight active preset button
      document.querySelectorAll('.preset-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });

      switchToSource('standby');
    }

    function switchToSource(newSource) {
      if (STATE.currentSource === newSource && !STATE.transitioning) return;

      // Update button highlights
      btnSwitchCamera.classList.toggle('active', newSource === 'camera');
      btnSwitchStandby.classList.toggle('active', newSource === 'standby');

      if (newSource !== 'standby') {
        document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
      }

      // Execute Smooth Crossfade
      STATE.targetSource = newSource;
      STATE.transitioning = true;
      STATE.transitionProgress = 0;
      let start = null;

      function step(timestamp) {
        if (!start) start = timestamp;
        let progress = (timestamp - start) / 500; // 0.5s fade
        if (progress > 1) progress = 1;

        STATE.transitionProgress = progress;

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          STATE.currentSource = STATE.targetSource;
          STATE.transitioning = false;
          STATE.transitionProgress = 0;
        }
      }
      requestAnimationFrame(step);
    }

    // TELOP OVERLAY LOGIC
    function toggleTelop(type) {
      const telop = STATE.telops[type];
      const input = type === 'topLeft' ? document.getElementById('telopTopLeftInput') : document.getElementById('telopBottomInput');
      const btn = type === 'topLeft' ? document.getElementById('telopTopLeftBtn') : document.getElementById('telopBottomBtn');

      telop.text = input.value;
      telop.active = !telop.active;

      btn.classList.toggle('active', telop.active);
      btn.textContent = telop.active ? '非表示' : '表示';
    }

    function autoTurnOffTelops() {
      ['topLeft', 'bottom'].forEach(type => {
        STATE.telops[type].active = false;
        const btn = type === 'topLeft' ? document.getElementById('telopTopLeftBtn') : document.getElementById('telopBottomBtn');
        btn.classList.remove('active');
        btn.textContent = '表示';
      });
    }

    // SCHOOL SONG TOGGLE
    schoolSongBtn.addEventListener('click', () => {
      STATE.schoolSongActive = !STATE.schoolSongActive;

      if (STATE.schoolSongActive) {
        autoTurnOffTelops();
        schoolSongBtn.classList.add('active');
        schoolSongBtn.textContent = ' 校歌 停止';
        statusBadge.classList.add('active');

        if (songAudio.src) songAudio.play();
        switchToSource('school_song');
      } else {
        schoolSongBtn.classList.remove('active');
        schoolSongBtn.textContent = ' 校歌 再生 / 歌詞表示';
        statusBadge.classList.remove('active');

        if (songAudio.src) {
          songAudio.pause();
          songAudio.currentTime = 0;
        }
        switchToSource('camera');
      }
    });

    // RENDER LOOP
    function renderLoop() {
      if (STATE.transitioning) {
        // Draw Current Source Base
        renderCanvas(pgmCtx, STATE.currentSource);
        // Overlay Target Source with Progress Alpha
        pgmCtx.save();
        pgmCtx.globalAlpha = STATE.transitionProgress;
        renderCanvas(pgmCtx, STATE.targetSource);
        pgmCtx.restore();
      } else {
        renderCanvas(pgmCtx, STATE.currentSource);
      }

      // Sync to PGM Window if Open
      if (pgmWindow && !pgmWindow.closed && pgmWindow.updateFrame) {
        pgmWindow.updateFrame(pgmCanvas);
      }

      requestAnimationFrame(renderLoop);
    }

    // CANVAS DRAWING HELPER
    function renderCanvas(ctx, sourceMode) {
      const w = 1280;
      const h = 720;

      ctx.clearRect(0, 0, w, h);

      if (sourceMode === 'camera') {
        ctx.save();
        if (STATE.cameraFlipped) {
          ctx.translate(w, 0);
          ctx.scale(-1, 1);
        }
        if (cameraVideo.readyState >= 2) {
          ctx.drawImage(cameraVideo, 0, 0, w, h);
        } else {
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(0, 0, w, h);
        }
        ctx.restore();

        // Draw Overlays
        renderTelops(ctx, w, h);

      } else if (sourceMode === 'standby') {
        if (bgImage.complete && bgImage.src) {
          ctx.drawImage(bgImage, 0, 0, w, h);
        } else {
          let grad = ctx.createLinearGradient(0, 0, w, h);
          grad.addColorStop(0, '#0f172a');
          grad.addColorStop(1, '#1e3a8a');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);
        }

        // Draw Standby Center Telop
        ctx.save();
        // Preset text is white text only; no text box or border.
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
        ctx.shadowBlur = 8;
        ctx.font = 'bold 52px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(STATE.currentStandbyText, w / 2, h / 2);
        ctx.restore();

      } else if (sourceMode === 'school_song') {
        if (songLyricsImage.complete && songLyricsImage.src) {
          ctx.drawImage(songLyricsImage, 0, 0, w, h);
        } else {
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(0, 0, w, h);
          ctx.fillStyle = '#f59e0b';
          ctx.font = 'bold 48px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText("♪ 校歌 演奏中", w / 2, h / 2);
        }
      }
    }

    // RENDER TELOP OVERLAYS WITH FADE IN/OUT
    function renderTelops(ctx, w, h) {
      ['topLeft', 'bottom'].forEach(type => {
        let t = STATE.telops[type];
        if (t.active && t.opacity < 1) t.opacity = Math.min(1, t.opacity + 0.1);
        if (!t.active && t.opacity > 0) t.opacity = Math.max(0, t.opacity - 0.1);
      });

      // Top-Left Telop
      const tl = STATE.telops.topLeft;
      if (tl.opacity > 0 && tl.text) {
        ctx.save();
        ctx.globalAlpha = tl.opacity;
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
        ctx.shadowBlur = 7;
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(tl.text, 60, 72);
        ctx.restore();
      }

      // Bottom Telop
      const b = STATE.telops.bottom;
      if (b.opacity > 0 && b.text) {
        ctx.save();
        ctx.globalAlpha = b.opacity;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(w / 2 - 400, h - 120, 800, 72);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.strokeRect(w / 2 - 400, h - 120, 800, 72);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 32px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.text, w / 2, h - 84);
        ctx.restore();
      }
    }

    // OPEN PGM WINDOW
    document.getElementById('openPgmBtn').addEventListener('click', () => {
      pgmWindow = window.open('', 'PGM_WINDOW', 'width=1280,height=720');
      if (!pgmWindow) {
        alert("ポップアップがブロックされました。ブラウザの設定で許可してください。");
        return;
      }

      pgmWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>PGM (Google Meet 共有専用)</title>
          <style>
            body { margin: 0; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
            canvas { width: 100%; height: 100%; object-fit: contain; }
          </style>
        </head>
        <body>
          <canvas id="outCanvas" width="1280" height="720"></canvas>
          <script>
            const outCanvas = document.getElementById('outCanvas');
            const outCtx = outCanvas.getContext('2d');
            window.updateFrame = function(sourceCanvas) {
              outCtx.clearRect(0, 0, 1280, 720);
              outCtx.drawImage(sourceCanvas, 0, 0);
            };
          <\/script>
        </body>
        </html>
      `);
    });
  </script>
</body>
</html>
