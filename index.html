<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fukumuro Broadcast</title>
  <style>
    :root {
      --bg-dark: #0b1120;
      --panel-bg: #172338;
      --panel-border: #33445f;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --danger-color: #ef4444;
      --success-color: #10b981;
      --warning-color: #f59e0b;
      --text-main: #f8fafc;
      --text-sub: #a9b8cc;
      --touch-target: 58px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    button, select, input, label {
      touch-action: manipulation;
    }

    button {
      font: inherit;
    }

    header {
      min-height: 64px;
      background: #080e1b;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 20px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand h1 {
      font-size: clamp(1rem, 1.8vw, 1.45rem);
      font-weight: 800;
      letter-spacing: .2px;
      color: #60a5fa;
    }

    .brand .subtitle {
      font-size: .85rem;
      color: var(--text-sub);
      background: #172338;
      padding: 5px 9px;
      border-radius: 6px;
      border: 1px solid var(--panel-border);
      white-space: nowrap;
    }

    .header-center { display: none; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-pgm-window {
      min-height: 48px;
      background: #7c3aed;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 9px;
      font-size: .95rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .2s, transform .1s;
    }

    .btn-pgm-window:hover { background: #6d28d9; }
    button:active { transform: scale(.98); }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px;
      padding: 14px;
      min-height: 0;
      overflow: hidden;
    }

    .program-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
      min-height: 0;
    }

    .monitor-box {
      flex: 1;
      min-height: 0;
      background: #000;
      border-radius: 12px;
      border: 2px solid var(--danger-color);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .monitor-header {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .monitor-tag {
      font-size: .8rem;
      font-weight: 900;
      padding: 7px 10px;
      border-radius: 5px;
      color: white;
      letter-spacing: .4px;
      background: #dc2626;
    }

    .canvas-container {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .clock-panel {
      flex-shrink: 0;
      min-height: 112px;
      background: #080e1b;
      border: 1px solid #263750;
      border-radius: 12px;
      padding: 10px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .clock-label {
      font-size: .85rem;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: .12em;
    }

    .clock-display {
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(2.5rem, 5vw, 4.8rem);
      line-height: 1.05;
      font-weight: 900;
      color: #38bdf8;
      letter-spacing: .04em;
      font-variant-numeric: tabular-nums;
    }

    .status-badge {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(239, 68, 68, .18);
      border: 1px solid var(--danger-color);
      color: #fca5a5;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: .85rem;
      font-weight: 800;
    }

    .status-badge.active { display: flex; }

    .status-dot {
      width: 9px;
      height: 9px;
      background-color: var(--danger-color);
      border-radius: 50%;
      animation: blink 1s infinite alternate;
    }

    @keyframes blink {
      0% { opacity: .3; }
      100% { opacity: 1; }
    }

    .control-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      overscroll-behavior: contain;
      min-width: 0;
      min-height: 0;
      padding-right: 3px;
      scrollbar-width: thin;
      scrollbar-color: #475569 transparent;
    }

    .panel-block {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-title {
      font-size: .9rem;
      font-weight: 800;
      color: #c2d0e2;
      letter-spacing: .02em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .main-screen-actions,
    .device-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-screen-switch {
      min-height: 66px;
      border: 1px solid #52647e;
      border-radius: 9px;
      font-weight: 800;
      font-size: clamp(.95rem, 1.25vw, 1.15rem);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      background: #334155;
      color: white;
      transition: background .2s, box-shadow .2s;
    }

    .btn-screen-switch.active {
      background: #2563eb;
      border-color: #60a5fa;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, .35);
    }

    .btn-toggle-large {
      min-height: var(--touch-target);
      border: 1px solid transparent;
      border-radius: 9px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 9px;
      transition: background .2s;
    }

    .btn-mic-on {
      background: #065f46;
      color: #a7f3d0;
      border-color: #059669;
    }

    .btn-mic-off {
      background: #7f1d1d;
      color: #fecaca;
      border-color: #dc2626;
    }

    .btn-flip {
      background: #334155;
      color: white;
      border-color: #52647e;
    }

    .btn-flip.active {
      background: #1d4ed8;
      border-color: #60a5fa;
    }

    .audio-meter-container {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0b1424;
      padding: 10px;
      border-radius: 7px;
      border: 1px solid #334155;
      min-height: 40px;
    }

    .audio-meter-label {
      font-size: .75rem;
      font-weight: 800;
      color: var(--text-sub);
      width: 84px;
      flex-shrink: 0;
    }

    .meter-bar-outer {
      flex: 1;
      height: 12px;
      background: #1e293b;
      border-radius: 6px;
      overflow: hidden;
    }

    .meter-bar-inner {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981 0%, #f59e0b 70%, #ef4444 100%);
      transition: width .05s ease-out;
    }

    .select-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .select-group label {
      font-size: .85rem;
      font-weight: 700;
      color: var(--text-sub);
    }

    select, input[type="text"] {
      background: #0b1424;
      color: white;
      border: 1px solid #455873;
      padding: 11px 12px;
      border-radius: 7px;
      font-size: 1rem;
      outline: none;
      width: 100%;
      min-height: 46px;
      user-select: text;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, .2);
    }

    .preset-grid {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .preset-item {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 9px;
      align-items: center;
    }

    .preset-btn {
      min-height: 48px;
      background: #334155;
      color: white;
      border: 1px solid #52647e;
      padding: 8px 12px;
      border-radius: 7px;
      font-size: .95rem;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
    }

    .preset-btn:hover { background: #475569; }

    .preset-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
    }

    .preset-input { min-width: 0; }

    .btn-school-song {
      min-height: 58px;
      background: #b96505;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 9px;
      font-weight: 900;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
    }

    .btn-school-song:hover { background: #a65305; }

    .btn-school-song.active {
      background: #dc2626;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, .6); }
      70% { box-shadow: 0 0 0 8px rgba(220, 38, 38, 0); }
      100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
    }

    .telop-control-group {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .telop-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .telop-row input { min-width: 0; }

    .btn-telop-toggle {
      min-width: 86px;
      min-height: 46px;
      background: #334155;
      color: white;
      border: 1px solid #52647e;
      padding: 8px 12px;
      border-radius: 7px;
      font-size: .9rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-telop-toggle.active {
      background: var(--success-color);
      border-color: #34d399;
      color: #052e24;
    }

    footer {
      min-height: 26px;
      background: #080e1b;
      border-top: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 10px;
      font-size: .7rem;
      color: #64748b;
      flex-shrink: 0;
    }

    .file-input-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
    }

    .file-input-wrapper label {
      font-size: .8rem;
      font-weight: 700;
      background: #334155;
      padding: 9px 10px;
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .file-input-wrapper input[type="file"] { display: none; }

    .file-name {
      font-size: .8rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    @media (max-width: 900px) {
      body { overflow: auto; }
      main {
        grid-template-columns: 1fr;
        overflow: visible;
      }
      .program-panel { min-height: 55vh; }
      .monitor-box { min-height: 300px; }
      .clock-panel { min-height: 100px; }
      .clock-display { font-size: clamp(2.8rem, 9vw, 4.5rem); }
      .control-panel { overflow: visible; }
      .brand .subtitle { display: none; }
    }

    @media (max-width: 520px) {
      header { padding: 10px 12px; gap: 8px; }
      .brand h1 { font-size: .95rem; }
      .btn-pgm-window { min-height: 46px; padding: 8px 10px; font-size: .8rem; }
      main { padding: 9px; gap: 10px; }
      .panel-block { padding: 11px; }
      .btn-screen-switch { min-height: 60px; font-size: .9rem; }
      .preset-item { grid-template-columns: 60px minmax(0, 1fr); }
      .file-input-wrapper { align-items: flex-start; flex-direction: column; gap: 4px; padding: 4px 0; }
    }
    /* Compact broadcast-console layout: keep the whole app inside the viewport */
    :root { --touch-target: 44px; }

    html, body { height: 100%; }
    body { height: 100dvh; min-height: 0; overflow: hidden; }

    header {
      min-height: 48px;
      height: 48px;
      padding: 5px 14px;
      gap: 10px;
    }
    .brand { gap: 8px; }
    .brand h1 { font-size: 1.05rem; white-space: nowrap; }
    .brand .subtitle { font-size: .72rem; padding: 3px 7px; }
    .btn-pgm-window {
      min-height: 36px;
      padding: 6px 12px;
      font-size: .82rem;
      border-radius: 7px;
      white-space: nowrap;
    }

    main {
      height: calc(100dvh - 68px);
      min-height: 0;
      grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
      gap: 10px;
      padding: 10px;
      overflow: hidden;
    }
    .program-panel { gap: 8px; min-height: 0; }
    .monitor-box { flex: 1 1 auto; min-height: 0; border-width: 1px; border-radius: 9px; }
    .monitor-header { top: 8px; left: 8px; }
    .monitor-tag { font-size: .68rem; padding: 5px 7px; }
    .clock-panel {
      min-height: 76px;
      padding: 6px 10px;
      gap: 0;
      border-radius: 9px;
    }
    .clock-label { font-size: .68rem; }
    .clock-display { font-size: clamp(2rem, 4vw, 3.3rem); line-height: 1.05; }
    .clock-panel .status-badge { padding: 3px 8px; font-size: .7rem; }
    .status-dot { width: 7px; height: 7px; }

    .control-panel {
      min-height: 0;
      overflow-y: auto;
      gap: 8px;
      padding: 0 3px 2px 0;
    }
    .panel-block {
      padding: 10px;
      gap: 8px;
      border-radius: 8px;
    }
    .panel-title { font-size: .78rem; }
    .main-screen-actions,
    .device-actions {
      grid-template-columns: repeat(2, minmax(0, 180px));
      justify-content: center;
      gap: 8px;
    }
    .btn-screen-switch {
      min-height: 48px;
      padding: 7px 8px;
      font-size: .88rem;
      border-radius: 8px;
    }
    .btn-toggle-large {
      min-height: 42px;
      padding: 7px 8px;
      font-size: .84rem;
      border-radius: 8px;
    }
    .audio-meter-container { min-height: 32px; padding: 6px 8px; gap: 8px; }
    .audio-meter-label { width: 72px; font-size: .68rem; }
    .meter-bar-outer { height: 9px; }
    .select-group { gap: 4px; }
    .select-group label { font-size: .74rem; }
    select, input[type="text"] {
      min-height: 36px;
      padding: 7px 9px;
      font-size: .86rem;
      border-radius: 6px;
    }
    .preset-grid { gap: 5px; }
    .preset-item { grid-template-columns: 48px minmax(0, 1fr); gap: 7px; }
    .preset-btn { min-height: 36px; padding: 5px 7px; font-size: .8rem; }
    .telop-control-group { gap: 6px; }
    .telop-row { grid-template-columns: minmax(0, 1fr) 70px; gap: 6px; }
    .btn-telop-toggle { min-width: 0; min-height: 36px; padding: 5px 7px; font-size: .8rem; }
    .btn-school-song {
      min-height: 42px;
      max-width: 250px;
      width: 100%;
      align-self: center;
      padding: 7px 10px;
      font-size: .86rem;
      border-radius: 8px;
    }
    .file-input-wrapper { min-height: 30px; gap: 7px; }
    .file-input-wrapper label { padding: 6px 8px; font-size: .72rem; }
    .file-name { font-size: .72rem; }
    footer { min-height: 20px; height: 20px; padding: 2px 8px; font-size: .64rem; }

    /* On smaller windows, allow the document to scroll naturally instead of clipping controls. */
    @media (max-width: 900px) {
      body { height: auto; min-height: 100%; overflow: auto; }
      header { height: auto; min-height: 48px; }
      main { height: auto; grid-template-columns: 1fr; overflow: visible; }
      .program-panel { min-height: 0; }
      .monitor-box { min-height: 42vw; aspect-ratio: 16 / 9; }
      .clock-panel { min-height: 76px; }
      .clock-display { font-size: clamp(2.2rem, 8vw, 3.3rem); }
      .control-panel { overflow: visible; }
      .brand .subtitle { display: none; }
    }
    @media (max-width: 520px) {
      header { padding: 7px 9px; }
      .brand h1 { font-size: .85rem; }
      .btn-pgm-window { min-height: 34px; padding: 5px 7px; font-size: .7rem; }
      main { padding: 8px; gap: 8px; }
      .panel-block { padding: 9px; }
      .main-screen-actions, .device-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .btn-screen-switch { min-height: 44px; font-size: .82rem; }
      .preset-item { grid-template-columns: 42px minmax(0, 1fr); }
      .file-input-wrapper { align-items: center; flex-direction: row; gap: 6px; }
      .file-input-wrapper label { max-width: 42%; }
    }
    @media (max-height: 700px) and (min-width: 901px) {
      header { height: 42px; min-height: 42px; }
      main { height: calc(100dvh - 62px); padding: 7px; gap: 8px; }
      .clock-panel { min-height: 64px; }
      .clock-display { font-size: clamp(1.8rem, 3.5vw, 2.7rem); }
      .panel-block { padding: 8px; gap: 6px; }
      .control-panel { gap: 6px; }
      footer { height: 20px; min-height: 20px; }
    }

    /* Requested control layout refinements */
    .operations-block { gap: 10px; }
    .operation-section { display: flex; flex-direction: column; gap: 7px; }
    .subsection-title { color: var(--text-sub); font-size: .74rem; font-weight: 800; }
    .main-screen-actions, .device-actions {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      justify-content: stretch;
      gap: 8px;
    }
    .btn-screen-switch, .btn-toggle-large { width: 100%; min-width: 0; }
    .btn-screen-switch { min-height: 52px; }
    .btn-toggle-large { min-height: 46px; }
    .device-selects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: start; }
    .mic-select-group { min-width: 0; }
    .mic-select-group .audio-meter-container { margin-top: 2px; min-height: 30px; padding: 5px 7px; gap: 6px; }
    .mic-select-group .audio-meter-label { width: auto; font-size: .62rem; }
    .mic-select-group .meter-bar-outer { min-width: 20px; height: 9px; }
    .song-operation .btn-school-song { width: 100%; max-width: none; min-height: 48px; }
    .preset-panel-title { gap: 8px; flex-wrap: wrap; }
    .upload-compact-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 32px; padding: 5px 10px; background: #334155; border: 1px solid #52647e; border-radius: 6px; color: #fff; font-size: .72rem; font-weight: 800; cursor: pointer; white-space: nowrap; }
    .upload-compact-btn:hover { background: #475569; }
    .hidden-file-input { display: none; }
    .preset-image-name { font-size: .68rem; }
    .telop-control-group { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .telop-row { grid-template-columns: minmax(0, 1fr) 58px; gap: 5px; }
    .btn-telop-toggle { min-width: 0; padding: 5px; }
    @media (min-width: 901px) {
      .control-panel { gap: 8px; }
      .panel-block { padding: 9px; gap: 7px; }
      .operations-block { gap: 8px; }
    }
    @media (max-width: 520px) {
      .device-selects { grid-template-columns: 1fr 1fr; gap: 7px; }
      .telop-control-group { grid-template-columns: 1fr; }
      .preset-panel-title { align-items: flex-start; }
      .upload-compact-btn { min-height: 30px; }
    }


    /* Refined broadcast controls and multiline presets */
    .operation-hint { color: var(--text-sub); font-size: .68rem; font-weight: 600; }
    .five-button-actions {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 7px;
      align-items: stretch;
    }
    .square-action {
      width: 100%;
      min-width: 0;
      min-height: 0;
      aspect-ratio: 2 / 1;
      padding: 6px 3px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: clamp(1.15rem, 2vw, 1.65rem);
      line-height: 1.1;
      white-space: normal;
    }
    .square-action span { font-size: clamp(.62rem, .9vw, .8rem); font-weight: 800; line-height: 1.2; }
    .btn-school-song { background: #a65305; color: #fff; border: 1px solid #d97706; }
    .btn-school-song.active { background: #b91c1c; border-color: #ef4444; animation: none; }
    .device-selects { margin-top: 2px; }
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

<body>

  <!-- HEADER -->
  <header>
    <div class="brand">
      <h1>Fukumuro Broadcast</h1>
      <span class="subtitle">校内Meet放送 ディレクター</span>
    </div>

    <div class="header-actions">
      <button id="openPgmBtn" class="btn-pgm-window">
         Meet共有用画面を開く (PGM)
      </button>
    </div>
  </header>

  <!-- MAIN WRAPPER (Left: Monitor, Right: Controls) -->
  <main>
    <!-- LEFT: PROGRAM MONITOR -->
    <div class="program-panel">
      <div class="monitor-box">
        <div class="monitor-header">
          <span class="monitor-tag">PROGRAM (放送中の画面)</span>
          <span id="programStatus" class="status-badge"><span class="status-dot"></span><span>校歌演奏中</span></span>
        </div>
        <div class="canvas-container">
          <canvas id="pgmCanvas" width="1280" height="720"></canvas>
        </div>
      </div>
      <div class="clock-panel">
        <div id="clock" class="clock-display">00:00:00</div>
      </div>
    </div>

    <!-- RIGHT: CONTROL PANEL -->
    <div class="control-panel">

      <!-- BROADCAST OPERATIONS: unified five-button control row -->
      <div class="panel-block operations-block">
        <div class="panel-title">放送操作 <span class="operation-hint">画面切替は自動ブラックフェード</span></div>
        <div class="main-screen-actions five-button-actions">
          <button id="btnSwitchCamera" class="btn-screen-switch active square-action" onclick="switchToSource('camera')" aria-label="カメラ画面へ">📹<span>カメラ</span></button>
          <button id="cameraFlipBtn" class="btn-toggle-large btn-flip square-action">↔<span>反転 OFF</span></button>
          <button id="micToggleBtn" class="btn-toggle-large btn-mic-on square-action">🎙️<span>マイク ON</span></button>
          <button id="schoolSongBtn" class="btn-school-song square-action" aria-label="校歌画像と音声を切り替え">🎵<span>校歌再生</span></button>
        </div>
        <div class="bgm-control-row" aria-label="BGM操作">
          <button type="button" id="bgmToggleBtn" class="btn-bgm" aria-pressed="false">🎶 BGM再生</button>
          <div class="bgm-volume-control">
            <label for="bgmVolume">音量</label>
            <input type="range" id="bgmVolume" min="0" max="100" value="50" step="1" aria-label="BGM音量">
            <span id="bgmVolumeValue">50%</span>
          </div>
        </div>
        <div class="device-selects">
          <div class="select-group">
            <label for="cameraSelect">カメラ選択</label>
            <select id="cameraSelect"></select>
          </div>
          <div class="select-group mic-select-group">
            <label for="micSelect">マイク選択</label>
            <select id="micSelect"></select>
            <div class="audio-meter-container">
              <span class="audio-meter-label">マイクレベル</span>
              <div class="meter-bar-outer"><div id="micMeterBar" class="meter-bar-inner"></div></div>
            </div>
          </div>
        </div>
      </div>

      <!-- PRESETS PANEL -->
      <div class="panel-block">
        <div class="panel-title preset-panel-title">
          <span>プリセット待機文字</span>
        </div>
        <div class="preset-grid">
          <div class="preset-item">
            <button class="preset-btn" onclick="applyPreset(0)">P1</button>
            <textarea id="presetText0" class="preset-input" rows="3" oninput="updatePresetTitle(0, this.value)">今日はテレビ放送があります</textarea>
          </div>
          <div class="preset-item">
            <button class="preset-btn" onclick="applyPreset(1)">P2</button>
            <textarea id="presetText1" class="preset-input" rows="3" oninput="updatePresetTitle(1, this.value)">しばらくお待ちください</textarea>
          </div>
          <div class="preset-item">
            <button class="preset-btn" onclick="applyPreset(2)">P3</button>
            <textarea id="presetText2" class="preset-input" rows="3" oninput="updatePresetTitle(2, this.value)">まもなくテレビ放送が始まります</textarea>
          </div>
          <div class="preset-item">
            <button class="preset-btn" onclick="applyPreset(3)">P4</button>
            <textarea id="presetText3" class="preset-input" rows="3" oninput="updatePresetTitle(3, this.value)">マイクをオフにしてお待ちください</textarea>
          </div>
          <div class="preset-item">
            <button class="preset-btn" onclick="applyPreset(4)">P5</button>
            <textarea id="presetText4" class="preset-input" rows="3" oninput="updatePresetTitle(4, this.value)">本日の放送は終了しました</textarea>
          </div>
        </div>
      </div>

      <!-- OVERLAY TELOPS -->
      <div class="panel-block">
        <div class="panel-title">オーバーレイテロップ</div>
        <div class="telop-control-group">
          <div class="telop-row">
            <input type="text" id="telopTopLeftInput" placeholder="左上テロップ">
            <button id="telopTopLeftBtn" class="btn-telop-toggle" onclick="toggleTelop('topLeft')">表示</button>
          </div>
          <div class="telop-row">
            <input type="text" id="telopBottomInput" placeholder="下部テロップ">
            <button id="telopBottomBtn" class="btn-telop-toggle" onclick="toggleTelop('bottom')">表示</button>
          </div>
        </div>
      </div>

      <!-- SCHOOL SONG & MEDIA ASSETS -->
      <div class="panel-block">
        <div class="panel-title">校歌 &amp; メディア素材</div>
        <div id="persistenceStatus" class="file-name" role="status" aria-live="polite" style="margin: -4px 0 8px;">保存データを確認しています…</div>

        <div class="media-assets-row media-assets-four">
          <div class="file-input-wrapper media-asset-item">
            <label for="presetImageFile" class="media-action-btn">プリセット画像をアップロード</label>
            <input type="file" id="presetImageFile" accept="image/*" class="hidden-file-input">
            <span id="presetImageName" class="file-name">待機画像：未選択</span>
          </div>
          <div class="file-input-wrapper media-asset-item">
            <button type="button" id="resetPresetImageBtn" class="media-action-btn reset-image-btn">プリセット画像をリセット</button>
            <span class="file-name">標準背景に戻す</span>
          </div>
          <div class="file-input-wrapper media-asset-item">
            <label for="songImageFile" class="media-action-btn">校歌画像を選択</label>
            <input type="file" id="songImageFile" accept="image/*" class="hidden-file-input">
            <span id="songImgName" class="file-name">未選択</span>
          </div>
          <div class="file-input-wrapper media-asset-item">
            <label for="songAudioFile" class="media-action-btn">校歌MP3を選択</label>
            <input type="file" id="songAudioFile" accept="audio/*" class="hidden-file-input">
            <span id="songAudioName" class="file-name">未選択</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    &copy; 2026 Hasegawa Konosuke. All rights reserved.
  </footer>

  <script>
    // GLOBAL STATE & VARIABLES
    const STATE = {
      currentSource: 'camera', // 'camera', 'standby', 'school_song'
      targetSource: 'camera',
      cameraFlipped: false,
      micMuted: false,
      schoolSongActive: false,
      bgmActive: false,
      bgmVolume: 0.5,
      
      presets: [
        "今日はテレビ放送があります",
        "しばらくお待ちください",
        "まもなくテレビ放送が始まります",
        "マイクをオフにしてお待ちください",
        "本日の放送は終了しました"
      ],
      currentStandbyText: "しばらくお待ちください",
      pendingStandbyText: null,

      telops: {
        topLeft: { text: "", active: false, opacity: 0 },
        bottom: { text: "", active: false, opacity: 0 }
      },

      // Fade Transition State
      transitioning: false,
      transitionPhase: 'out',
      transitionProgress: 0
    };

    // DOM ELEMENTS
    const pgmCanvas = document.getElementById('pgmCanvas');
    const pgmCtx = pgmCanvas.getContext('2d');
    // The PGM window renders directly from the live camera/video sources via drawCurrentProgramFrame().

    const clockEl = document.getElementById('clock');
    const statusBadge = document.getElementById('programStatus');
    const cameraSelect = document.getElementById('cameraSelect');
    const micSelect = document.getElementById('micSelect');
    const micToggleBtn = document.getElementById('micToggleBtn');
    const cameraFlipBtn = document.getElementById('cameraFlipBtn');
    const micMeterBar = document.getElementById('micMeterBar');
    const schoolSongBtn = document.getElementById('schoolSongBtn');
    const bgmToggleBtn = document.getElementById('bgmToggleBtn');
    const bgmVolumeInput = document.getElementById('bgmVolume');
    const bgmVolumeValue = document.getElementById('bgmVolumeValue');
    const btnSwitchCamera = document.getElementById('btnSwitchCamera');

    // MEDIA ASSETS
    let cameraVideo = document.createElement('video');
    cameraVideo.autoplay = true;
    cameraVideo.playsInline = true;

    let bgImage = new Image();
    let songLyricsImage = new Image();
    let songAudio = new Audio();

    // WEB AUDIO API
    let audioCtx = null;
    let micStream = null;
    let micSourceNode = null;
    let analyserNode = null;
    let micMeterData = null;
    let micMeterLastUpdate = 0;
    let micOperationId = 0;
    let micRecoveryTimer = null;
    let micRecoveryInProgress = false;

    let pgmWindow = null;

    // LOCAL PERSISTENCE (IndexedDB): preset text, background image, school-song image/audio
    const STORAGE_DB_NAME = 'FukumuroBroadcastStorage';
    const STORAGE_DB_VERSION = 1;
    let storageDB = null;
    const persistenceStatus = document.getElementById('persistenceStatus');

    // GitHubリポジトリに置く標準素材（HTMLと同じフォルダに配置）
    // ファイル選択でアップロードされた素材や、このブラウザに保存済みの素材を優先します。
    const BUNDLED_ASSETS = {
      background: 'background.png',
      schoolSongImage: 'school-song-image.png',
      schoolSongAudio: 'school-song.mp3',
      bgmAudio: 'BGM.mp3'
    };

    function loadBundledImage(imageTarget, filename, nameElement, namePrefix = '') {
      return new Promise((resolve) => {
        const image = new Image();
        image.onload = () => {
          imageTarget.src = image.src;
          if (nameElement) nameElement.textContent = `${namePrefix}${filename}（GitHub標準素材）`;
          resolve(true);
        };
        image.onerror = () => resolve(false); // ファイル未配置なら従来の表示を使用
        image.src = new URL(filename, window.location.href).href;
      });
    }

    async function loadBundledAssets() {
      await Promise.all([
        loadBundledImage(bgImage, BUNDLED_ASSETS.background, document.getElementById('presetImageName'), '待機画像：'),
        loadBundledImage(songLyricsImage, BUNDLED_ASSETS.schoolSongImage, document.getElementById('songImgName'))
      ]);

      // MP3はファイルが存在する場合だけ標準素材として設定します。
      const bundledAudioUrl = new URL(BUNDLED_ASSETS.schoolSongAudio, window.location.href).href;
      try {
        const response = await fetch(bundledAudioUrl, { method: 'HEAD', cache: 'no-cache' });
        if (response.ok) {
          songAudio.src = bundledAudioUrl;
          document.getElementById('songAudioName').textContent = `${BUNDLED_ASSETS.schoolSongAudio}（GitHub標準素材）`;
        }
      } catch (_) {
        // ローカルプレビュー等でHEAD確認できない場合は、標準MP3を設定せず手動選択を利用します。
      }
    }

    function setPersistenceStatus(message, isError = false) {
      if (!persistenceStatus) return;
      persistenceStatus.textContent = message;
      persistenceStatus.style.color = isError ? '#f87171' : 'var(--muted-color, #94a3b8)';
    }

    function openStorageDB() {
      return new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) {
          reject(new Error('このブラウザはIndexedDBに対応していません。'));
          return;
        }
        const request = indexedDB.open(STORAGE_DB_NAME, STORAGE_DB_VERSION);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains('savedData')) {
            db.createObjectStore('savedData', { keyPath: 'key' });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error('保存領域を開けませんでした。'));
      });
    }

    function storageGet(key) {
      return new Promise((resolve, reject) => {
        if (!storageDB) return resolve(null);
        const request = storageDB.transaction('savedData', 'readonly').objectStore('savedData').get(key);
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error);
      });
    }

    function storagePut(record) {
      return new Promise((resolve, reject) => {
        if (!storageDB) return reject(new Error('保存領域が利用できません。'));
        const transaction = storageDB.transaction('savedData', 'readwrite');
        transaction.objectStore('savedData').put(record);
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error || new Error('保存に失敗しました。'));
        transaction.onabort = () => reject(transaction.error || new Error('保存が中断されました。'));
      });
    }

    function storageDelete(key) {
      return new Promise((resolve, reject) => {
        if (!storageDB) return resolve();
        const transaction = storageDB.transaction('savedData', 'readwrite');
        transaction.objectStore('savedData').delete(key);
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error || new Error('保存データを削除できませんでした。'));
      });
    }

    async function saveAsset(key, file) {
      try {
        await storagePut({ key, blob: file, name: file.name || key, type: file.type || '' });
        setPersistenceStatus('自動保存済み：プリセット・画像・校歌データは次回起動時にも復元されます。');
      } catch (error) {
        console.error('データ保存エラー:', error);
        setPersistenceStatus('保存できませんでした。ファイル容量やブラウザの空き容量を確認してください。', true);
      }
    }

    async function restoreAsset(key, imageTarget, nameElement, namePrefix = '') {
      const record = await storageGet(key);
      if (!record || !record.blob) return false;
      const objectUrl = URL.createObjectURL(record.blob);
      if (imageTarget instanceof HTMLImageElement) {
        imageTarget.src = objectUrl;
      } else if (imageTarget instanceof HTMLAudioElement) {
        imageTarget.src = objectUrl;
      }
      if (nameElement) nameElement.textContent = `${namePrefix}${record.name || '保存済みデータ'}`;
      return true;
    }

    async function restoreSavedData() {
      try {
        storageDB = await openStorageDB();
        const savedPresets = await storageGet('presetTexts');
        if (savedPresets && Array.isArray(savedPresets.value)) {
          STATE.presets = STATE.presets.map((defaultText, index) =>
            typeof savedPresets.value[index] === 'string' ? savedPresets.value[index] : defaultText
          );
          STATE.presets.forEach((value, index) => {
            const input = document.getElementById(`presetText${index}`);
            if (input) input.value = value;
          });
        }

        await restoreAsset('presetBackground', bgImage, document.getElementById('presetImageName'), '待機画像：');
        await restoreAsset('schoolSongImage', songLyricsImage, document.getElementById('songImgName'));
        await restoreAsset('schoolSongAudio', songAudio, document.getElementById('songAudioName'));
        setPersistenceStatus('自動保存 ON：プリセット・画像・校歌データをこのブラウザに保存します。');
      } catch (error) {
        console.error('保存データの復元エラー:', error);
        setPersistenceStatus('自動保存を利用できません。ブラウザの設定をご確認ください。', true);
      }
    }

    // INITIALIZATION
    window.addEventListener('DOMContentLoaded', async () => {
      initClock();
      await loadBundledAssets();
      await restoreSavedData();
      await initAudio();
      await initDevices();
      renderLoop();
    });

    // CLOCK
    function initClock() {
      setInterval(() => {
        const now = new Date();
        clockEl.textContent = now.toTimeString().split(' ')[0];
      }, 1000);
    }

    // DEVICE SETUP
    // Chromebook/Chromeでは、権限取得前の enumerateDevices() では
    // deviceId や label が十分に取得できないことがあります。
    // そのため「まずマイク許可を取得 → デバイスを再列挙 → 実際のマイクを選択」
    // の順番にしています。
    async function requestMicrophonePermission() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('このブラウザではマイク機能を利用できません。HTTPS接続とChromeの設定を確認してください。');
      }

      // すでにマイクストリームがある場合は再取得しません。
      if (micStream && micStream.getAudioTracks().some(track => track.readyState === 'live')) {
        return micStream;
      }

      // Chromebookでは deviceId を指定せず audio:true で最初の許可取得を
      // 行うほうが安定します。許可後に enumerateDevices() で実機IDを取得します。
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          // 放送用：入力音声を加工しない安定化モード
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
          channelCount: { ideal: 1 }
        }
      });

      // startMic() で同じデバイスを正式に接続するため、ここでは一旦停止します。
      stream.getTracks().forEach(track => track.stop());
      return stream;
    }

    async function populateDeviceLists() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const previousCameraId = cameraSelect.value;
      const previousMicId = micSelect.value;

      cameraSelect.innerHTML = '';
      micSelect.innerHTML = '';

      let cameraCount = 0;
      let micCount = 0;

      devices.forEach(device => {
        if (device.kind === 'videoinput') {
          cameraCount++;
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.textContent = device.label || `カメラ${cameraCount}`;
          cameraSelect.appendChild(option);
        } else if (device.kind === 'audioinput') {
          micCount++;
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.textContent = device.label || `マイク${micCount}`;
          micSelect.appendChild(option);
        }
      });

      if (previousCameraId && [...cameraSelect.options].some(o => o.value === previousCameraId)) {
        cameraSelect.value = previousCameraId;
      }
      if (previousMicId && [...micSelect.options].some(o => o.value === previousMicId)) {
        micSelect.value = previousMicId;
      }

      return { cameraCount, micCount };
    }

    async function initDevices() {
      try {
        // 最初にマイク許可を取得。これによりChromebookでも deviceId/label が
        // 正しく公開されるようになります。
        await requestMicrophonePermission();

        const counts = await populateDeviceLists();

        if (counts.cameraCount > 0) {
          await startCamera(cameraSelect.value);
        }

        if (counts.micCount > 0) {
          await startMic(micSelect.value);
        } else {
          setPersistenceStatus('マイクが見つかりません。Chromebookのマイク権限と入力デバイスを確認してください。', true);
        }
      } catch (e) {
        console.error('Device Initialization Error:', e);
        if (e && e.name === 'NotAllowedError') {
          setPersistenceStatus('マイクが許可されていません。Chromeのサイト設定でマイクを「許可」にしてください。', true);
        } else if (e && e.name === 'NotFoundError') {
          setPersistenceStatus('マイクが見つかりません。Chromebookの入力デバイスを確認してください。', true);
        } else {
          setPersistenceStatus('マイクを初期化できませんでした。Chromeのマイク設定を確認してください。', true);
        }
      }
    }

    // Chrome/ChromebookでUSBマイク・イヤホンマイクなどを接続した場合にも
    // 一覧を更新します。現在使用中のマイクは可能な限り維持します。
    if (navigator.mediaDevices && 'addEventListener' in navigator.mediaDevices) {
      navigator.mediaDevices.addEventListener('devicechange', async () => {
        try {
          const selectedMic = micSelect.value;
          await populateDeviceLists();
          if (selectedMic && [...micSelect.options].some(o => o.value === selectedMic)) {
            micSelect.value = selectedMic;
          }

          const activeTrack = getLiveMicTrack();
          if (!activeTrack || activeTrack.readyState !== 'live' || activeTrack.muted) {
            scheduleMicRecovery('devicechange');
          }
        } catch (e) {
          console.warn('Device list update error:', e);
        }
      });
    }

    // 共有中にChrome/OS側で音声コンテキストが停止した場合でも、
    // メーター側を復旧させます。放送本線は直接MediaStreamなので影響を受けにくくなっています。
    document.addEventListener('visibilitychange', async () => {
      if (audioCtx && document.visibilityState === 'visible' && audioCtx.state === 'suspended') {
        try { await audioCtx.resume(); } catch (_) {}
      }

      const track = getLiveMicTrack();
      if (track && (track.readyState === 'ended' || track.muted)) {
        scheduleMicRecovery('visibilitychange');
      }
    });

    window.addEventListener('focus', () => {
      const track = getLiveMicTrack();
      if (track && (track.readyState === 'ended' || track.muted)) {
        scheduleMicRecovery('focus');
      }
    });

    cameraSelect.addEventListener('change', () => startCamera(cameraSelect.value));
    micSelect.addEventListener('change', () => startMic(micSelect.value));

    async function startCamera(deviceId) {
      if (cameraVideo.srcObject) {
        cameraVideo.srcObject.getTracks().forEach(t => t.stop());
        cameraVideo.srcObject = null;
      }

      try {
        const constraints = {
          video: deviceId
            ? { deviceId: { exact: deviceId }, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }
            : { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        cameraVideo.srcObject = stream;
        await cameraVideo.play().catch(() => {});
      } catch (e) {
        console.error('Camera Start Error:', e);
        // exactなdeviceIdがChromebook側で一時的に無効になった場合は、
        // デフォルトカメラで再試行します。
        if (deviceId && (e.name === 'OverconstrainedError' || e.name === 'NotFoundError')) {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            cameraVideo.srcObject = stream;
            await cameraVideo.play().catch(() => {});
            await populateDeviceLists();
          } catch (fallbackError) {
            console.error('Camera fallback error:', fallbackError);
          }
        }
      }
    }

    // AUDIO SYSTEM
    //
    // 放送用マイクの本線は Web Audio の MediaStreamDestination を経由させず、
    // 音声加工（EC/NS/AGC）もOFFにした原音優先の安定化モードです。
    // 「実マイク stream → PGMタブのaudio要素 → Chromeのタブ共有」という
    // 最短経路にします。これにより、画面共有中の音切れ要因を減らします。
    async function initAudio() {
      if (audioCtx) return;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) throw new Error('Web Audio APIを利用できません。');

      // メーター専用のAudioContextです。放送本線には接続しません。
      audioCtx = new AudioContextClass({ latencyHint: 'interactive' });
      analyserNode = audioCtx.createAnalyser();
      analyserNode.fftSize = 128;
      analyserNode.smoothingTimeConstant = 0.82;
      micMeterData = new Uint8Array(analyserNode.fftSize);

      updateAudioMeter();
    }

    function clearMicRecoveryTimer() {
      if (micRecoveryTimer) {
        clearTimeout(micRecoveryTimer);
        micRecoveryTimer = null;
      }
    }

    function getLiveMicTrack(stream = micStream) {
      return stream && stream.getAudioTracks ? stream.getAudioTracks()[0] : null;
    }

    function setMicTrackHealthHandlers(stream) {
      const track = getLiveMicTrack(stream);
      if (!track) return;

      const schedule = (reason) => {
        // 古いストリームのイベントは無視します。
        if (stream !== micStream) return;
        console.warn('マイク状態変化:', reason, track.readyState, track.muted);
        scheduleMicRecovery(reason);
      };

      track.addEventListener('ended', () => schedule('ended'), { once: true });
      track.addEventListener('mute', () => schedule('mute'), { once: false });
      track.addEventListener('unmute', () => {
        if (stream !== micStream) return;
        clearMicRecoveryTimer();
        if (!STATE.micMuted) setPersistenceStatus('マイク：接続中');
      });
    }

    function scheduleMicRecovery(reason = 'unknown') {
      if (micRecoveryInProgress || micRecoveryTimer) return;
      if (STATE.micMuted) return;

      // 一瞬のUSB/Chrome内部ミュートでは即再取得せず、一定時間待ってから確認します。
      micRecoveryTimer = setTimeout(async () => {
        micRecoveryTimer = null;
        const track = getLiveMicTrack();
        if (track && track.readyState === 'live' && !track.muted) return;

        try {
          micRecoveryInProgress = true;
          setPersistenceStatus(`マイク音声を再接続しています…（${reason}）`);
          const ok = await startMic(micSelect.value, { recovery: true });
          if (ok) {
            const actualSettings = typeof newTrack.getSettings === 'function' ? newTrack.getSettings() : {};
        const processingOff = actualSettings.echoCancellation === false &&
          actualSettings.noiseSuppression === false &&
          actualSettings.autoGainControl === false;
        setPersistenceStatus(processingOff ? 'マイク：安定化モード（音声処理OFF）' : 'マイク：接続中');
          }
        } finally {
          micRecoveryInProgress = false;
        }
      }, 1200);
    }

    async function startMic(deviceId, options = {}) {
      if (!audioCtx) await initAudio();
      if (audioCtx.state === 'suspended') {
        try { await audioCtx.resume(); } catch (_) {}
      }

      const operationId = ++micOperationId;

      // 先に新しいstreamを取得し、成功してから古いstreamを停止します。
      // これで、デバイス切替や一時的な再接続時の無音時間を最小化します。
      let newStream = null;
      try {
        const audioConstraints = {
          // 放送用マイクは音声加工をOFFにします。
          // ノイズ抑制・AGC・エコーキャンセルによるゲート/ポンピング/
          // 母音の断続的な消失を避け、連続した声をそのままPGMへ送ります。
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
          channelCount: { ideal: 1 }
        };
        if (deviceId) audioConstraints.deviceId = { exact: deviceId };

        try {
          newStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
        } catch (firstError) {
          if (!deviceId || !['OverconstrainedError', 'NotFoundError'].includes(firstError.name)) {
            throw firstError;
          }
          console.warn('指定マイクを取得できないため、標準マイクへ切り替えます:', firstError);
          newStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false,
              channelCount: { ideal: 1 }
            }
          });
          await populateDeviceLists();
        }

        if (operationId !== micOperationId) {
          newStream.getTracks().forEach(t => t.stop());
          return false;
        }

        const newTrack = getLiveMicTrack(newStream);
        if (!newTrack) throw new Error('マイク音声トラックを取得できませんでした。');
        if ('contentHint' in newTrack) {
          try { newTrack.contentHint = 'speech'; } catch (_) {}
        }

        // getUserMediaの要求だけでなく、取得後のtrackにも再適用します。
        // 非対応のブラウザでは無視されるため、ここで失敗してもマイク自体は継続します。
        try {
          await newTrack.applyConstraints({
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          });
        } catch (constraintError) {
          console.warn('マイクの音声加工OFF設定を再適用できませんでした:', constraintError);
        }

        newTrack.enabled = !STATE.micMuted;

        // メーターだけWeb Audioへ接続。本線の共有音声には接続しません。
        const newSourceNode = audioCtx.createMediaStreamSource(newStream);
        newSourceNode.connect(analyserNode);

        const oldStream = micStream;
        const oldSourceNode = micSourceNode;

        micStream = newStream;
        micSourceNode = newSourceNode;
        setMicTrackHealthHandlers(newStream);

        // PGMタブには実マイクstreamを直接渡します。
        // MediaStreamAudioDestinationNodeを挟まないことで、共有時の音声経路を短縮します。
        if (pgmWindow && !pgmWindow.closed && typeof pgmWindow.setMicStream === 'function') {
          try {
            await pgmWindow.setMicStream(newStream);
          } catch (error) {
            console.warn('PGMへのマイク接続エラー:', error);
          }
        }

        // 新しいstreamがPGMへ渡ってから古いstreamを停止します。
        if (oldSourceNode) {
          try { oldSourceNode.disconnect(); } catch (_) {}
        }
        if (oldStream) {
          oldStream.getTracks().forEach(t => {
            try { t.stop(); } catch (_) {}
          });
        }

        clearMicRecoveryTimer();

        console.log('使用中のマイク:', newTrack.label || '標準マイク', {
          settings: typeof newTrack.getSettings === 'function' ? newTrack.getSettings() : {},
          recovery: Boolean(options.recovery)
        });
        setPersistenceStatus('マイク：接続中');
        return true;
      } catch (e) {
        if (newStream && operationId !== micOperationId) {
          newStream.getTracks().forEach(t => t.stop());
        }
        console.error('Mic Start Error:', e);
        if (e && e.name === 'NotAllowedError') {
          setPersistenceStatus('マイクが許可されていません。Chromeのサイト設定で「マイク→許可」にしてください。', true);
        } else if (e && e.name === 'NotFoundError') {
          setPersistenceStatus('マイクが見つかりません。Chromebookの入力デバイスを確認してください。', true);
        } else {
          setPersistenceStatus('マイクを開始できませんでした。Chromebookのマイク設定とChromeのサイト権限を確認してください。', true);
        }
        return false;
      }
    }

    function updateAudioMeter(timestamp = performance.now()) {
      requestAnimationFrame(updateAudioMeter);

      // メーター更新を約20fpsに抑え、Chromebookで毎フレーム配列生成・計算をしないようにします。
      if (timestamp - micMeterLastUpdate < 50) return;
      micMeterLastUpdate = timestamp;

      if (!analyserNode || !micMeterData || STATE.micMuted) {
        micMeterBar.style.width = '0%';
        return;
      }

      analyserNode.getByteTimeDomainData(micMeterData);
      let sumSquares = 0;
      for (let i = 0; i < micMeterData.length; i++) {
        const sample = (micMeterData[i] - 128) / 128;
        sumSquares += sample * sample;
      }
      const rms = Math.sqrt(sumSquares / micMeterData.length);
      const val = Math.min(100, Math.round(rms * 260));
      micMeterBar.style.width = val + '%';
    }

    // MIC MUTE & FLIP CONTROLS
    micToggleBtn.addEventListener('click', () => {
      STATE.micMuted = !STATE.micMuted;
      if (micStream) {
        micStream.getAudioTracks().forEach(t => t.enabled = !STATE.micMuted);
      }
      if (STATE.micMuted) {
        micToggleBtn.innerHTML = '🎙️<span>マイク OFF</span>';
        micToggleBtn.className = 'btn-toggle-large btn-mic-off square-action';
      } else {
        micToggleBtn.innerHTML = '🎙️<span>マイク ON</span>';
        micToggleBtn.className = 'btn-toggle-large btn-mic-on square-action';
        // 共有PGM側のaudio要素も即時に再生状態へ戻します。
        if (micStream && pgmWindow && !pgmWindow.closed && typeof pgmWindow.setMicStream === 'function') {
          pgmWindow.setMicStream(micStream).catch(() => {});
        }
      }
    });

    cameraFlipBtn.addEventListener('click', () => {
      STATE.cameraFlipped = !STATE.cameraFlipped;
      cameraFlipBtn.classList.toggle('active', STATE.cameraFlipped);
      cameraFlipBtn.innerHTML = STATE.cameraFlipped ? '↔<span>反転 ON</span>' : '↔<span>反転 OFF</span>';
    });

    // FILE UPLOAD HANDLERS
    document.getElementById('presetImageFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        if (bgImage.src && bgImage.src.startsWith('blob:')) URL.revokeObjectURL(bgImage.src);
        bgImage.src = URL.createObjectURL(file);
        document.getElementById('presetImageName').textContent = `待機画像：${file.name}`;
        saveAsset('presetBackground', file);
      }
    });

    document.getElementById('resetPresetImageBtn').addEventListener('click', () => {
      if (bgImage.src && bgImage.src.startsWith('blob:')) URL.revokeObjectURL(bgImage.src);
      bgImage = new Image();
      document.getElementById('presetImageFile').value = '';
      document.getElementById('presetImageName').textContent = '待機画像：標準背景を読み込み中…';
      loadBundledImage(bgImage, BUNDLED_ASSETS.background, document.getElementById('presetImageName'), '待機画像：').then((loaded) => {
        if (!loaded) document.getElementById('presetImageName').textContent = '待機画像：未選択（標準グラデーション）';
      });
      storageDelete('presetBackground').then(() => setPersistenceStatus('待機画像をGitHub標準素材に戻しました。')).catch(error => {
        console.error('待機画像の削除エラー:', error);
        setPersistenceStatus('待機画像を保存領域から削除できませんでした。', true);
      });
    });

    document.getElementById('songImageFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        songLyricsImage.src = URL.createObjectURL(file);
        document.getElementById('songImgName').textContent = file.name;
        saveAsset('schoolSongImage', file);
      }
    });

    document.getElementById('songAudioFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        songAudio.src = URL.createObjectURL(file);
        document.getElementById('songAudioName').textContent = file.name;
        saveAsset('schoolSongAudio', file);
      }
    });

    // PRESET & SOURCE SWITCHING WITH AUTOMATIC CROSSFADE
    let presetSaveTimer = null;
    function updatePresetTitle(index, val) {
      STATE.presets[index] = val;
      const btns = document.querySelectorAll('.preset-btn');
      if (btns[index]) btns[index].textContent = `P${index + 1}`;
      clearTimeout(presetSaveTimer);
      presetSaveTimer = setTimeout(async () => {
        try {
          await storagePut({ key: 'presetTexts', value: [...STATE.presets] });
          setPersistenceStatus('自動保存済み：プリセット・画像・校歌データは次回起動時にも復元されます。');
        } catch (error) {
          console.error('プリセット保存エラー:', error);
          setPersistenceStatus('プリセットを保存できませんでした。', true);
        }
      }, 250);
    }

    function applyPreset(index) {
      autoTurnOffTelops();
      // Keep the old text until the fade-out reaches full black.
      STATE.pendingStandbyText = STATE.presets[index];

      // Highlight active preset button
      document.querySelectorAll('.preset-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });

      switchToSource('standby', true);
    }

    function switchToSource(newSource, forceTransition = false) {
      if (STATE.currentSource === newSource && !STATE.transitioning && !forceTransition) return;

      // Update button highlights
      btnSwitchCamera.classList.toggle('active', newSource === 'camera');

      if (newSource === 'camera' || newSource === 'school_song') {
        document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
      }

      // Fade to black first, switch the source while black, then fade in.
      // This also runs when changing from one preset to another preset.
      STATE.targetSource = newSource;
      STATE.transitioning = true;
      STATE.transitionPhase = 'out';
      STATE.transitionProgress = 0;
      let start = null;
      const fadeDuration = 1200; // ゆったりしたフェードアウト／フェードイン（各1.2秒）

      function step(timestamp) {
        if (!start) start = timestamp;
        const rawProgress = Math.min(1, (timestamp - start) / fadeDuration);
        // Smoothstep easing: start gently, move smoothly, and finish gently.
        const progress = rawProgress * rawProgress * (3 - 2 * rawProgress);
        STATE.transitionProgress = progress;

        if (progress < 1) {
          requestAnimationFrame(step);
          return;
        }

        if (STATE.transitionPhase === 'out') {
          // Change source and preset text only after the old picture is fully black.
          STATE.currentSource = STATE.targetSource;
          if (STATE.pendingStandbyText !== null) {
            STATE.currentStandbyText = STATE.pendingStandbyText;
            STATE.pendingStandbyText = null;
          }
          STATE.transitionPhase = 'in';
          STATE.transitionProgress = 0;
          start = null;
          requestAnimationFrame(step);
        } else {
          STATE.transitioning = false;
          STATE.transitionProgress = 0;
        }
      }
      requestAnimationFrame(step);
    }

    // TELOP OVERLAY LOGIC
    function toggleTelop(type) {
      const telop = STATE.telops[type];
      const input = type === 'topLeft' ? document.getElementById('telopTopLeftInput') : document.getElementById('telopBottomInput');
      const btn = type === 'topLeft' ? document.getElementById('telopTopLeftBtn') : document.getElementById('telopBottomBtn');

      telop.text = input.value;
      telop.active = !telop.active;

      btn.classList.toggle('active', telop.active);
      btn.textContent = telop.active ? '非表示' : '表示';
    }

    function autoTurnOffTelops() {
      ['topLeft', 'bottom'].forEach(type => {
        STATE.telops[type].active = false;
        const btn = type === 'topLeft' ? document.getElementById('telopTopLeftBtn') : document.getElementById('telopBottomBtn');
        btn.classList.remove('active');
        btn.textContent = '表示';
      });
    }

    // BGM is played inside the PGM tab so Google Meet can capture it as tab audio.
    function updateBgmButton() {
      bgmToggleBtn.classList.toggle('active', STATE.bgmActive);
      bgmToggleBtn.setAttribute('aria-pressed', String(STATE.bgmActive));
      bgmToggleBtn.textContent = STATE.bgmActive ? '⏹ BGM停止' : '🎶 BGM再生';
    }

    bgmVolumeInput.addEventListener('input', () => {
      STATE.bgmVolume = Number(bgmVolumeInput.value) / 100;
      bgmVolumeValue.textContent = `${bgmVolumeInput.value}%`;
      if (pgmWindow && !pgmWindow.closed && typeof pgmWindow.setBgmVolume === 'function') {
        pgmWindow.setBgmVolume(STATE.bgmVolume);
      }
    });

    bgmToggleBtn.addEventListener('click', () => {
      if (!STATE.bgmActive) {
        const bgmUrl = new URL(BUNDLED_ASSETS.bgmAudio, window.location.href).href;
        if (!pgmWindow || pgmWindow.closed) openPgmWindow();
        if (!pgmWindow || pgmWindow.closed) {
          alert('Meet共有用画面を開けませんでした。ポップアップを許可してください。');
          return;
        }
        STATE.bgmActive = true;
        updateBgmButton();
        try {
          const playPromise = pgmWindow.playBgm(bgmUrl, STATE.bgmVolume);
          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(error => {
              console.warn('PGM画面でBGMを再生できません:', error);
              STATE.bgmActive = false;
              updateBgmButton();
              alert('BGM.mp3を再生できませんでした。GitHubのindex.htmlと同じフォルダに「BGM.mp3」を置き、ファイル名の大文字・小文字も確認してください。');
            });
          }
        } catch (error) {
          console.warn('PGM画面のBGM再生エラー:', error);
          STATE.bgmActive = false;
          updateBgmButton();
        }
      } else {
        STATE.bgmActive = false;
        updateBgmButton();
        if (pgmWindow && !pgmWindow.closed && typeof pgmWindow.stopBgm === 'function') {
          pgmWindow.stopBgm();
        }
      }
    });

    // SCHOOL SONG: play audio inside the PGM window so its sound is included
    // when that window is shared in Google Meet. The image stays on PROGRAM
    // when playback is stopped.
    schoolSongBtn.addEventListener('click', () => {
      if (!STATE.schoolSongActive) {
        if (!songAudio.src) {
          alert('先に「校歌MP3を選択」から校歌音声を読み込んでください。');
          return;
        }
        // Open the PGM window from this user gesture if it has not been opened yet.
        if (!pgmWindow || pgmWindow.closed) openPgmWindow();
        if (!pgmWindow || pgmWindow.closed) {
          alert('Meet共有用画面を開けませんでした。ポップアップを許可してください。');
          return;
        }
        STATE.schoolSongActive = true;
        schoolSongBtn.classList.add('active');
        schoolSongBtn.innerHTML = '⏹️<span>校歌停止</span>';
        statusBadge.classList.add('active');
        switchToSource('school_song', true);
        try {
          // Direct synchronous call from the button gesture helps satisfy autoplay policy.
          const playPromise = pgmWindow.playSchoolSong(songAudio.src);
          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(err => {
              console.warn('PGM画面で校歌を再生できません:', err);
              alert('校歌を再生できませんでした。PGM画面を一度クリックしてから、もう一度校歌ボタンを押してください。');
            });
          }
        } catch (err) {
          console.warn('PGM画面の校歌再生エラー:', err);
        }
      } else {
        STATE.schoolSongActive = false;
        schoolSongBtn.classList.remove('active');
        schoolSongBtn.innerHTML = '🎵<span>校歌再生</span>';
        statusBadge.classList.remove('active');
        if (pgmWindow && !pgmWindow.closed && typeof pgmWindow.stopSchoolSong === 'function') {
          pgmWindow.stopSchoolSong();
        }
        // Deliberately leave the lyrics image on PROGRAM when stopping the song.
      }
    });

    // Draw the current PROGRAM frame. Exposed so the separate PGM window can
    // render at its own refresh rate even while the director window is in the background.
    window.drawCurrentProgramFrame = function(targetCtx) {
      if (!targetCtx) return;
      if (STATE.transitioning) {
        renderCanvas(targetCtx, STATE.currentSource);
        targetCtx.save();
        targetCtx.globalAlpha = STATE.transitionPhase === 'out'
          ? STATE.transitionProgress
          : 1 - STATE.transitionProgress;
        targetCtx.fillStyle = '#000000';
        targetCtx.fillRect(0, 0, 1280, 720);
        targetCtx.restore();
      } else {
        renderCanvas(targetCtx, STATE.currentSource);
      }
    };

    // RENDER LOOP
    function renderLoop() {
      window.drawCurrentProgramFrame(pgmCtx);
      requestAnimationFrame(renderLoop);
    }

    // CANVAS DRAWING HELPER
    function renderCanvas(ctx, sourceMode) {
      const w = 1280;
      const h = 720;

      ctx.clearRect(0, 0, w, h);

      if (sourceMode === 'camera') {
        ctx.save();
        if (STATE.cameraFlipped) {
          ctx.translate(w, 0);
          ctx.scale(-1, 1);
        }
        if (cameraVideo.readyState >= 2) {
          ctx.drawImage(cameraVideo, 0, 0, w, h);
        } else {
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(0, 0, w, h);
        }
        ctx.restore();

        // Draw Overlays
        renderTelops(ctx, w, h);

      } else if (sourceMode === 'standby') {
        if (bgImage.complete && bgImage.src) {
          ctx.drawImage(bgImage, 0, 0, w, h);
        } else {
          let grad = ctx.createLinearGradient(0, 0, w, h);
          grad.addColorStop(0, '#0f172a');
          grad.addColorStop(1, '#1e3a8a');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);
        }

        // Draw Standby Center Telop
        ctx.save();
        // Preset text is white text only; no text box or border.
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
        ctx.shadowBlur = 8;
        ctx.font = 'bold 62px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const presetLines = String(STATE.currentStandbyText || '').split(/\n/);
        const lineHeight = 78;
        const firstLineY = h / 2 - ((presetLines.length - 1) * lineHeight) / 2;
        presetLines.forEach((line, lineIndex) => {
          ctx.fillText(line, w / 2, firstLineY + lineIndex * lineHeight, w - 120);
        });
        ctx.restore();

      } else if (sourceMode === 'school_song') {
        if (songLyricsImage.complete && songLyricsImage.src) {
          ctx.drawImage(songLyricsImage, 0, 0, w, h);
        } else {
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(0, 0, w, h);
          ctx.fillStyle = '#f59e0b';
          ctx.font = 'bold 48px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText("校歌歌詞画像をアップロードしてください", w / 2, h / 2);
        }
      }

      // Song-playing status is shown only in the director UI, not in the shared program output.
    }

    // RENDER TELOP OVERLAYS WITH FADE IN/OUT
    function renderTelops(ctx, w, h) {
      ['topLeft', 'bottom'].forEach(type => {
        let t = STATE.telops[type];
        if (t.active && t.opacity < 1) t.opacity = Math.min(1, t.opacity + 0.02);
        if (!t.active && t.opacity > 0) t.opacity = Math.max(0, t.opacity - 0.02);
      });

      // Top-Left Telop
      const tl = STATE.telops.topLeft;
      if (tl.opacity > 0 && tl.text) {
        ctx.save();
        ctx.globalAlpha = tl.opacity;
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
        ctx.shadowBlur = 7;
        ctx.font = 'bold 42px sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(tl.text, 24, 42, w - 48);
        ctx.restore();
      }

      // Bottom Telop
      const b = STATE.telops.bottom;
      if (b.opacity > 0 && b.text) {
        ctx.save();
        ctx.globalAlpha = b.opacity;
        // Plain white text only: no background box or border.
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
        ctx.shadowBlur = 8;
        ctx.font = 'bold 46px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.text, w / 2, h - 48, w - 80);
        ctx.restore();
      }
    }

    // OPEN PGM WINDOW
    function openPgmWindow() {
      if (pgmWindow && !pgmWindow.closed) {
        pgmWindow.focus();
        return;
      }
      pgmWindow = window.open('', 'PGM_WINDOW'); // Open as a browser tab so Meet can share tab audio
      if (!pgmWindow) {
        alert("ポップアップがブロックされました。ブラウザの設定で許可してください。");
        return;
      }

      pgmWindow.document.write(`
        <!DOCTYPE html>
        <html lang="ja">
        <head>
          <meta charset="utf-8">
          <title>PGM (Google Meet 共有専用)</title>
          <style>
            html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
            body { display: flex; align-items: center; justify-content: center; }
            canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
          </style>
        </head>
        <body>
          <canvas id="outCanvas" width="1280" height="720" aria-label="Google Meet共有用ライブ映像"></canvas>
          <audio id="pgmSchoolSongAudio" preload="auto"></audio>
          <audio id="pgmBgmAudio" preload="auto" loop></audio>
          <audio id="pgmMicAudio" autoplay playsinline preload="none"></audio>
          <script>
            const outCanvas = document.getElementById('outCanvas');
            const outCtx = outCanvas.getContext('2d', { alpha: false });
            const pgmSchoolSongAudio = document.getElementById('pgmSchoolSongAudio');
            const pgmBgmAudio = document.getElementById('pgmBgmAudio');
            const pgmMicAudio = document.getElementById('pgmMicAudio');
            let lastDrawError = '';
            const audioFadeTimers = new WeakMap();

            function cancelAudioFade(audio) {
              const timer = audioFadeTimers.get(audio);
              if (timer) clearInterval(timer);
              audioFadeTimers.delete(audio);
            }

            function fadeAudioVolume(audio, targetVolume, durationMs, onComplete) {
              cancelAudioFade(audio);
              const startVolume = Number(audio.volume) || 0;
              const endVolume = Math.max(0, Math.min(1, Number(targetVolume)));
              const startTime = performance.now();
              const timer = setInterval(() => {
                const progress = Math.min(1, (performance.now() - startTime) / durationMs);
                // Smoothstep easing makes the fade gentle at both ends.
                const eased = progress * progress * (3 - 2 * progress);
                audio.volume = Math.max(0, Math.min(1, startVolume + (endVolume - startVolume) * eased));
                if (progress >= 1) {
                  clearInterval(timer);
                  audioFadeTimers.delete(audio);
                  if (typeof onComplete === 'function') onComplete();
                }
              }, 20);
              audioFadeTimers.set(audio, timer);
            }

            // Directorから受け取った実マイクstreamを、そのまま共有PGMタブで再生します。
            // 放送音声は「実マイクstream → audio要素 → Chromeのタブ共有」の最短経路です。
            // Web Audioの遅延処理や再合成は行いません。
            let sharedMicStream = null;
            let micPlayRetryTimer = null;
            let boundMicTrack = null;
            let micPlayBusy = false;

            async function playSharedMic() {
              if (!sharedMicStream) return false;
              const track = sharedMicStream.getAudioTracks && sharedMicStream.getAudioTracks()[0];
              if (!track || track.readyState !== 'live') return false;

              try {
                // srcObjectはstreamが変わったときだけ差し替えます。
                // 毎回差し替えると、連続音声が一瞬途切れる原因になるためです。
                if (pgmMicAudio.srcObject !== sharedMicStream) {
                  pgmMicAudio.pause();
                  pgmMicAudio.srcObject = sharedMicStream;
                }

                pgmMicAudio.autoplay = true;
                pgmMicAudio.playsInline = true;
                pgmMicAudio.muted = false;
                pgmMicAudio.volume = 1;

                if (pgmMicAudio.paused && !micPlayBusy) {
                  micPlayBusy = true;
                  try {
                    await pgmMicAudio.play();
                  } finally {
                    micPlayBusy = false;
                  }
                }

                return !pgmMicAudio.paused;
              } catch (error) {
                console.warn('PGMマイク音声の再生待機:', error);
                return false;
              }
            }

            window.setMicStream = async function(stream) {
              if (!stream) return false;
              sharedMicStream = stream;

              const track = stream.getAudioTracks && stream.getAudioTracks()[0];
              if (track && track !== boundMicTrack) {
                boundMicTrack = track;

                track.addEventListener('ended', () => {
                  if (stream === sharedMicStream) {
                    console.warn('PGM側でマイクtrackが終了しました。');
                  }
                }, { once: true });

                track.addEventListener('mute', () => {
                  if (stream === sharedMicStream) {
                    console.warn('PGM側でマイクtrackが一時ミュートされました。');
                  }
                });

                track.addEventListener('unmute', () => {
                  if (stream === sharedMicStream) {
                    playSharedMic();
                  }
                });
              }

              return playSharedMic();
            };

            // 共有タブのaudio要素が一時停止した場合だけ再開します。
            // 再生中にsrcObjectを触らないため、連続音声を細切れにしにくい構成です。
            setInterval(() => {
              if (!sharedMicStream) return;
              const track = sharedMicStream.getAudioTracks && sharedMicStream.getAudioTracks()[0];
              if (!track || track.readyState !== 'live') return;

              if (pgmMicAudio.paused && !micPlayRetryTimer) {
                micPlayRetryTimer = setTimeout(async () => {
                  micPlayRetryTimer = null;
                  await playSharedMic();
                }, 250);
              }
            }, 1500);

            pgmMicAudio.addEventListener('pause', () => {
              if (sharedMicStream && !micPlayRetryTimer) {
                micPlayRetryTimer = setTimeout(async () => {
                  micPlayRetryTimer = null;
                  await playSharedMic();
                }, 150);
              }
            });

            pgmMicAudio.addEventListener('stalled', () => {
              if (sharedMicStream && !micPlayRetryTimer) {
                micPlayRetryTimer = setTimeout(async () => {
                  micPlayRetryTimer = null;
                  await playSharedMic();
                }, 200);
              }
            });

            window.addEventListener('pointerdown', () => {
              if (sharedMicStream) playSharedMic();
            }, { passive: true });

            // These functions are called by the director window. Audio is played
            // in this shared PGM window, so Google Meet can capture it with the video.
            window.playSchoolSong = function(audioUrl) {
              cancelAudioFade(pgmSchoolSongAudio);
              if (pgmSchoolSongAudio.src !== audioUrl) pgmSchoolSongAudio.src = audioUrl;
              pgmSchoolSongAudio.volume = 1;
              pgmSchoolSongAudio.currentTime = 0;
              return pgmSchoolSongAudio.play();
            };
            window.stopSchoolSong = function() {
              if (pgmSchoolSongAudio.paused) {
                pgmSchoolSongAudio.currentTime = 0;
                return;
              }
              fadeAudioVolume(pgmSchoolSongAudio, 0, 1400, () => {
                pgmSchoolSongAudio.pause();
                pgmSchoolSongAudio.currentTime = 0;
                pgmSchoolSongAudio.volume = 1;
              });
            };

            // BGM plays in the shared PGM tab, not in the director UI.
            // Loop until the director presses Stop; volume is controlled from the director UI.
            window.playBgm = function(audioUrl, volume) {
              cancelAudioFade(pgmBgmAudio);
              if (pgmBgmAudio.src !== audioUrl) pgmBgmAudio.src = audioUrl;
              pgmBgmAudio.loop = true;
              pgmBgmAudio.volume = Math.max(0, Math.min(1, Number(volume)));
              pgmBgmAudio.dataset.targetVolume = String(pgmBgmAudio.volume);
              pgmBgmAudio.currentTime = 0;
              return pgmBgmAudio.play();
            };
            window.setBgmVolume = function(volume) {
              pgmBgmAudio.volume = Math.max(0, Math.min(1, Number(volume)));
              pgmBgmAudio.dataset.targetVolume = String(pgmBgmAudio.volume);
            };
            window.stopBgm = function() {
              if (pgmBgmAudio.paused) {
                pgmBgmAudio.currentTime = 0;
                return;
              }
              const restoreVolume = Math.max(0, Math.min(1, Number(pgmBgmAudio.dataset.targetVolume ?? pgmBgmAudio.volume)));
              fadeAudioVolume(pgmBgmAudio, 0, 1400, () => {
                pgmBgmAudio.pause();
                pgmBgmAudio.currentTime = 0;
                pgmBgmAudio.volume = restoreVolume;
              });
            };

            // Render from the opener's live camera/video sources in THIS window's
            // animation loop. This avoids a frozen copied frame when the director
            // window is backgrounded and its requestAnimationFrame is throttled.
            function drawLiveProgram() {
              try {
                if (window.opener && !window.opener.closed &&
                    typeof window.opener.drawCurrentProgramFrame === 'function') {
                  window.opener.drawCurrentProgramFrame(outCtx);
                  lastDrawError = '';
                } else {
                  outCtx.fillStyle = '#000000';
                  outCtx.fillRect(0, 0, outCanvas.width, outCanvas.height);
                  outCtx.fillStyle = '#ffffff';
                  outCtx.font = '28px sans-serif';
                  outCtx.textAlign = 'center';
                  outCtx.fillText('ディレクター画面を開き直してください', outCanvas.width / 2, outCanvas.height / 2);
                }
              } catch (error) {
                if (!lastDrawError) console.warn('PGMライブ描画エラー:', error);
                lastDrawError = String(error);
              }
            }
            // Use a timer-driven renderer instead of relying only on rAF, which
            // some browsers throttle aggressively when a shared window is in the background.
            drawLiveProgram();
            window.setInterval(drawLiveProgram, 1000 / 30);
          <\/script>
        </body>
        </html>
      `);
      // Finalize the popup document so its inline script starts consistently.
      pgmWindow.document.close();
      // Set initial BGM volume and microphone sync delay in the PGM tab.
      try { pgmWindow.setBgmVolume(STATE.bgmVolume); } catch (_) {}
      try { } catch (_) {}
      // Attach the current real microphone stream directly to the shared PGM tab.
      if (micStream && micStream.getAudioTracks().length) {
        try {
          pgmWindow.setMicStream(micStream);
        } catch (error) {
          console.warn('PGMへのマイク接続を後で再試行します:', error);
        }
      }
    }

    document.getElementById('openPgmBtn').addEventListener('click', openPgmWindow);
  </script>
</body>
</html>
